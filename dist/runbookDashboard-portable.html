<!DOCTYPE html>
<!-- PORTABLE BUILD — generated 2026-04-15 by _bundle.js -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go-Live Runbook Dashboard</title>
<link rel="icon" id="favicon" type="image/png" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* ═══════════════════════════════════════════════════════
       SEMANTIC DESIGN TOKENS — Corporate Palette (Dark)
       Override via [data-palette] for neon, [data-theme] for light
       ═══════════════════════════════════════════════════════ */
    :root {
        /* Surfaces */
        --color-surface: #0a0a0f;
        --color-surface-elevated: #111118;
        --color-surface-hover: #151520;
        --color-surface-row: #0d0d12;
        --color-surface-bar: #1a1a22;
        --color-surface-form: #0d0d12;
        --color-surface-action: #181820;

        /* Glass (dark mode — tinted-glass look) */
        --glass-bg: rgba(17, 17, 24, 0.55);
        --glass-bg-elevated: rgba(22, 22, 32, 0.6);
        --glass-blur: 18px;
        --glass-border: rgba(255, 255, 255, 0.06);
        --glass-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);

        /* Text */
        --color-text-primary: #e0e0e0;
        --color-text-secondary: #888;
        --color-text-dim: #555;
        --color-text-emphasis: #ffffff;

        /* Borders */
        --color-border: #222;
        --color-border-strong: #333;
        --color-border-subtle: #1a1a1a;

        /* Status: Success (Done / Completed) */
        --color-success: #10b981;
        --color-success-bg: #052e16;
        --color-success-text: #6ee7b7;

        /* Status: Warning (In Progress) */
        --color-warning: #f59e0b;
        --color-warning-bg: #451a03;
        --color-warning-text: #fcd34d;

        /* Status: Danger (Blocked / Red) */
        --color-danger: #ef4444;
        --color-danger-bg: #450a0a;
        --color-danger-text: #fca5a5;

        /* Status: Info */
        --color-info: #3b82f6;

        /* Status: Issues */
        --color-issues: #f97316;

        /* Status: Neutral (Not Started / Unneeded) */
        --color-neutral: #aaaaaa;
        --color-neutral-muted: #888888;
        --color-neutral-dim: #666666;
        --color-neutral-bg: #1a1a1a;

        /* Primary / Accent (overridden by config.accentColor via JS) */
        --color-primary: var(--color-success);

        /* Labels */
        --color-label: #8888dd;

        /* Progress gradient */
        --color-progress-from: var(--color-success);
        --color-progress-to: var(--color-info);

        /* Toast */
        --color-toast-bg: var(--color-success-bg);
        --color-toast-border: #065f46;
        --color-toast-text: var(--color-success-text);

        /* ── Atomic Aliases (backward compat) ─────────────── */
        --bg: var(--color-surface);
        --text: var(--color-text-primary);
        --text-muted: var(--color-text-secondary);
        --text-dim: var(--color-text-dim);
        --card-bg: var(--color-surface-elevated);
        --card-border: var(--color-border);
        --card-hover: var(--color-surface-hover);
        --input-bg: var(--color-surface-elevated);
        --input-border: var(--color-border-strong);
        --row-bg: var(--color-surface-row);
        --row-border: var(--color-border-subtle);
        --row-hover: var(--color-surface-hover);
        --bar-bg: var(--color-surface-bar);
        --divider: var(--color-border);
        --green: var(--color-success);
        --amber: var(--color-warning);
        --red: var(--color-danger);
        --yellow: var(--color-warning-text);
        --pink: var(--color-danger-text);
        --blue: var(--color-info);
        --orange: var(--color-issues);
        --green-bg: var(--color-success-bg);
        --green-text: var(--color-success-text);
        --amber-bg: var(--color-warning-bg);
        --red-bg: var(--color-danger-bg);
        --red-text: var(--color-danger-text);
        --completed-text: var(--color-success-text);
        --item-label-color: var(--color-label);
        --stat-total: var(--color-text-emphasis);
        --stat-done: var(--color-success);
        --stat-inprog: var(--color-warning-text);
        --stat-notstarted: var(--color-neutral);
        --stat-pct: var(--color-info);
        --stat-issues: var(--color-issues);
        --stat-blocking: var(--color-danger);
        --progress-from: var(--color-progress-from);
        --progress-to: var(--color-progress-to);
        --health-green: var(--color-success);
        --health-green-bg: var(--color-success-bg);
        --health-amber: var(--color-warning);
        --health-amber-bg: var(--color-warning-bg);
        --health-red: var(--color-danger);
        --health-red-bg: var(--color-danger-bg);
        --dot-done: var(--color-success);
        --dot-inprog: var(--color-warning-text);
        --dot-notstarted: var(--color-neutral);
        --btn-done-bg: var(--color-success-bg);
        --btn-done-border: var(--color-success);
        --btn-done-color: var(--color-success);
        --btn-inprog-bg: var(--color-warning-bg);
        --btn-inprog-border: var(--color-warning-text);
        --btn-inprog-color: var(--color-warning-text);
        --btn-notstarted-bg: var(--color-neutral-bg);
        --btn-notstarted-border: var(--color-neutral);
        --btn-notstarted-color: var(--color-neutral);
        --stat-blocked: var(--color-danger);
        --stat-unneeded: var(--color-neutral-muted);
        --dot-blocked: var(--color-danger);
        --dot-unneeded: var(--color-neutral-dim);
        --btn-blocked-bg: var(--color-danger-bg);
        --btn-blocked-border: var(--color-danger);
        --btn-blocked-color: var(--color-danger);
        --btn-unneeded-bg: var(--color-neutral-bg);
        --btn-unneeded-border: var(--color-neutral-dim);
        --btn-unneeded-color: var(--color-neutral-dim);
        --blocked-text: var(--color-text-emphasis);
        --unneeded-text: var(--color-neutral-dim);
        --blocked-bg: var(--color-neutral-bg);
        --blocked-tag-text: var(--color-text-emphasis);
        --unneeded-bg: var(--color-neutral-bg);
        --unneeded-tag-text: var(--color-neutral-muted);
        --issue-form-bg: var(--color-surface-form);
        --btn-bg: var(--color-surface-action);
        --btn-border: var(--color-border-strong);
        --action-bg: var(--color-surface-action);
        --action-border: var(--color-border-strong);
        --toast-bg: var(--color-toast-bg);
        --toast-border: var(--color-toast-border);
        --toast-text: var(--color-toast-text);
    }

    /* ═══ NEON PALETTE (Dark) ═══ */
    [data-palette="neon"] {
        --color-success: #39ff14;
        --color-success-bg: #0d3d0d;
        --color-success-text: #7bff7b;
        --color-warning: #ffa500;
        --color-warning-bg: #3d3000;
        --color-warning-text: #ffd84a;
        --color-danger: #ff3333;
        --color-danger-bg: #3a0a0a;
        --color-danger-text: #ff8888;
        --color-info: #5bc0ff;
        --color-issues: #ff9944;
        --color-toast-bg: #1a3a1a;
        --color-toast-border: #2a5a2a;
        --color-toast-text: #7bff7b;
    }

    /* ═══ LIGHT THEME (Corporate) ═══ */
    [data-theme="light"] {
        --color-surface: #f4f5f7;
        --color-surface-elevated: #ffffff;
        --color-surface-hover: #f0f0f5;
        --color-surface-row: #fafafa;
        --color-surface-bar: #e0e0e0;
        --color-surface-form: #f5f5fa;
        --color-surface-action: #f5f5f5;
        --color-text-primary: #1a1a2e;
        --color-text-secondary: #555;
        --color-text-dim: #888;
        --color-text-emphasis: #1a1a2e;
        --color-border: #ddd;
        --color-border-strong: #ccc;
        --color-border-subtle: #e8e8e8;
        --color-success: #059669;
        --color-success-bg: #ecfdf5;
        --color-success-text: #059669;
        --color-warning: #d97706;
        --color-warning-bg: #fffbeb;
        --color-warning-text: #d97706;
        --color-danger: #dc2626;
        --color-danger-bg: #fef2f2;
        --color-danger-text: #dc2626;
        --color-info: #2563eb;
        --color-issues: #ea580c;
        --color-neutral: #888888;
        --color-neutral-muted: #757575;
        --color-neutral-dim: #9e9e9e;
        --color-neutral-bg: #f0f0f0;
        --color-label: #5c5c99;
        --color-toast-bg: #ecfdf5;
        --color-toast-border: #a7f3d0;
        --color-toast-text: #059669;
        --blocked-bg: #e0e0e0;
        --unneeded-bg: #f5f5f5;
    }

    /* ═══ LIGHT THEME + NEON PALETTE ═══ */
    [data-theme="light"][data-palette="neon"] {
        --color-success: #2e7d32;
        --color-success-bg: #e8f5e9;
        --color-success-text: #2e7d32;
        --color-warning: #e65100;
        --color-warning-bg: #fff3e0;
        --color-warning-text: #e65100;
        --color-danger: #c62828;
        --color-danger-bg: #ffebee;
        --color-danger-text: #c62828;
        --color-info: #1565c0;
        --color-issues: #e65100;
        --color-toast-bg: #e8f5e9;
        --color-toast-border: #a5d6a7;
        --color-toast-text: #2e7d32;
    }

    /* ═══ TYPE SCALE ═══ */
    :root {
        --font-sans: 'Outfit', system-ui, -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
        --text-xs: 0.68rem;
        --text-sm: 0.78rem;
        --text-base: 0.88rem;
        --text-md: 0.95rem;
        --text-lg: 1.1rem;
        --text-xl: 1.35rem;
        --text-2xl: 1.65rem;
        --text-3xl: 2rem;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        margin: 0 auto;
        padding: 20px 30px;
        max-width: 1280px;
        line-height: 1.5;
        transition: background 0.3s, color 0.3s;
        position: relative;
    }
    /* Ambient gradient — gives the glass panels something to blur over */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
            radial-gradient(ellipse 80% 50% at 20% 20%, rgba(56, 30, 114, 0.35) 0%, transparent 60%),
            radial-gradient(ellipse 60% 40% at 80% 70%, rgba(20, 60, 100, 0.30) 0%, transparent 55%),
            radial-gradient(ellipse 50% 50% at 50% 50%, rgba(10, 80, 60, 0.15) 0%, transparent 50%),
            var(--bg);
        pointer-events: none;
    }
    [data-theme="light"] body::before { display: none; }

    /* BACKGROUND IMAGE */
    .bg-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: -1;
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        opacity: 0.80;
        pointer-events: none;
    }
    [data-theme="light"] .bg-overlay { opacity: 0.80; }

    /* Light mode: disable glass tokens → fall back to solid backgrounds */
    [data-theme="light"] {
        --glass-bg: initial;
        --glass-bg-elevated: initial;
        --glass-blur: initial;
        --glass-border: initial;
        --glass-shadow: initial;
    }

    /* HEADER — compact top bar */
    .header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--glass-border, var(--divider));
        position: relative;
        flex-wrap: wrap;
        background: var(--glass-bg, transparent);
        backdrop-filter: blur(var(--glass-blur, 0));
        -webkit-backdrop-filter: blur(var(--glass-blur, 0));
        border-radius: 14px;
        box-shadow: var(--glass-shadow, none);
    }
    [data-theme="light"] .header {
        background: rgba(255,255,255,0.7);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border-radius: 14px;
        padding: 14px 20px;
        margin: -10px -10px 20px;
    }
    .header-left {
        display: flex;
        align-items: center;
        gap: 14px;
        flex: 1 1 300px;
        min-width: 0;
    }
    .header-info {
        display: flex;
        flex-direction: column;
        min-width: 0;
    }
    .header-row {
        display: flex;
        align-items: center;
        gap: 16px;
    }
    .client-logo {
        width: 44px;
        height: 44px;
        object-fit: contain;
        flex-shrink: 0;
        border-radius: 6px;
    }
    .client-logo.hidden { display: none; }
    .header h1 {
        margin: 0;
        font-size: var(--text-lg);
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .header .subtitle {
        color: var(--text-muted);
        font-size: var(--text-xs);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .header .clock {
        font-size: var(--text-sm);
        color: var(--green);
        font-family: var(--font-mono);
        transition: color 0.3s ease;
        white-space: nowrap;
    }
    .header-center {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }
    .header-right {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
    }

    /* HEALTH INDICATOR */
    .health-bar {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .health-label {
        font-size: var(--text-xs);
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        white-space: nowrap;
    }
    .health-indicator {
        display: flex;
        gap: 6px;
    }
    .health-dot {
        min-width: 38px;
        height: 32px;
        padding: 0 8px;
        border-radius: 16px;
        border: 2px solid var(--input-border);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--text-xs);
        font-weight: bold;
        transition: all 0.2s;
        opacity: 0.3;
        user-select: none;
        white-space: nowrap;
    }
    .health-dot:hover { opacity: 0.7; transform: scale(1.1); }
    .health-dot.active { opacity: 1; transform: scale(1.15); box-shadow: 0 0 16px rgba(255,255,255,0.15); }
    .health-dot.green { background: var(--health-green-bg); border-color: var(--health-green); color: var(--health-green); }
    .health-dot.green.active { box-shadow: 0 0 20px rgba(57,255,20,0.3); }
    .health-dot.amber { background: var(--health-amber-bg); border-color: var(--health-amber); color: var(--health-amber); }
    .health-dot.amber.active { box-shadow: 0 0 20px rgba(255,165,0,0.3); }
    .health-dot.red { background: var(--health-red-bg); border-color: var(--health-red); color: var(--health-red); }
    .health-dot.red.active { box-shadow: 0 0 20px rgba(255,51,51,0.3); }
    .health-text {
        font-size: var(--text-sm);
        font-weight: 700;
        letter-spacing: 1px;
    }
    .health-text.green { color: var(--health-green); }
    .health-text.amber { color: var(--health-amber); }
    .health-text.red { color: var(--health-red); }

    /* GLOBAL STATS */
    .global-stats {
        margin-bottom: 24px;
    }
    .stats-master {
        position: relative;
        margin-bottom: 16px;
        height: 52px;
        background: var(--glass-bg, var(--card-bg));
        border: 1px solid var(--glass-border, var(--card-border));
        border-radius: 12px;
        overflow: hidden;
        backdrop-filter: blur(var(--glass-blur, 0));
        -webkit-backdrop-filter: blur(var(--glass-blur, 0));
        box-shadow: var(--glass-shadow, none);
    }
    .stats-master .progress-fill {
        position: absolute;
        top: 0; left: 0; bottom: 0;
        border-radius: 12px 0 0 12px;
        transition: width 0.5s ease, background 0.4s ease;
    }
    .stats-master .progress-text {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 1;
    }
    .stats-master .master-pct {
        font-size: var(--text-2xl);
        font-weight: bold;
        color: #fff;
        text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        line-height: 1;
    }
    .stats-master .master-label {
        font-size: 0.75em;
        color: rgba(255,255,255,0.85);
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    .stats-master .master-detail {
        font-size: 1em;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    .stats-groups {
        display: flex;
        gap: 16px;
    }
    .stats-group {
        flex: 1;
        display: flex;
        gap: 10px;
    }
    .stats-group-label {
        font-size: 0.7em;
        color: var(--text);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 6px;
        text-align: center;
    }
    .stat-card {
        background: var(--glass-bg-elevated, var(--card-bg));
        border: 1px solid var(--glass-border, var(--card-border));
        border-radius: 10px;
        padding: 14px 20px;
        text-align: center;
        flex: 1;
        min-width: 0;
        backdrop-filter: blur(var(--glass-blur, 0));
        -webkit-backdrop-filter: blur(var(--glass-blur, 0));
        box-shadow: var(--glass-shadow, none);
    }
    .stat-card .stat-value {
        font-size: var(--text-2xl);
        font-weight: bold;
    }
    .stat-card .stat-label {
        font-size: var(--text-xs);
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 2px;
    }
    @media (max-width: 700px) {
        .stats-groups { flex-direction: column; }
        .stats-master { flex-direction: column; gap: 8px; padding: 14px 20px; }
    }
    .stat-card.issues .stat-value { color: var(--stat-issues); }
    .stat-card.blocking .stat-value { color: var(--stat-blocking); }
    .stat-card.total .stat-value { color: var(--stat-total); }
    .stat-card.done .stat-value { color: var(--stat-done); }
    .stat-card.inprog .stat-value { color: var(--stat-inprog); }
    .stat-card.notstarted .stat-value { color: var(--stat-notstarted); }
    .stat-card.pct .stat-value { color: var(--stat-pct); }
    .stat-card.blocked .stat-value { color: var(--stat-blocked); }
    .stat-card.unneeded .stat-value { color: var(--stat-unneeded); }

    /* GLOBAL PROGRESS */
    .global-progress {
        margin-bottom: 24px;
    }
    .global-progress-bar {
        width: 100%;
        background: var(--bar-bg);
        height: 18px;
        border-radius: 10px;
        overflow: hidden;
        position: relative;
    }
    .global-progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--progress-from), var(--progress-to));
        transition: width 0.5s ease;
        border-radius: 10px;
    }
    .global-progress-label {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 18px;
        line-height: 18px;
        text-align: center;
        font-size: 0.7em;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    /* CONTROLS — sticky filter bar */
    .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--bg);
        padding: 10px 0;
        transition: background 0.3s;
    }
    .controls::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: -30px;
        right: -30px;
        height: 1px;
        background: var(--divider);
        opacity: 0;
        transition: opacity 0.2s;
    }
    .controls.stuck::after {
        opacity: 1;
    }
    @supports (backdrop-filter: blur(8px)) {
        .controls {
            background: color-mix(in srgb, var(--bg) 85%, transparent);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    }
    .filter-group {
        display: flex;
        gap: 4px;
    }
    .filterBtn {
        background: var(--card-bg);
        border: 1px solid var(--input-border);
        padding: 7px 14px;
        border-radius: 6px;
        cursor: pointer;
        color: var(--text-muted);
        font-family: inherit;
        font-size: var(--text-sm);
        transition: all 0.2s;
        user-select: none;
    }
    .filterBtn:hover { background: var(--bar-bg); color: var(--text); }
    .filterBtn.active { background: var(--input-border); color: var(--text); border-color: var(--text-dim); }
    .filterBtn:focus-visible { outline: 2px solid var(--color-info); outline-offset: 2px; }

    .search-box {
        flex: 1;
        min-width: 200px;
        max-width: 400px;
        padding: 7px 14px;
        border-radius: 6px;
        border: 1px solid var(--input-border);
        background: var(--input-bg);
        color: var(--text);
        font-size: 0.85em;
        outline: none;
    }
    .search-box:focus { border-color: var(--blue); }
    .search-box::placeholder { color: var(--text-dim); }

    .sort-select {
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid var(--input-border);
        background: var(--input-bg);
        color: var(--text);
        font-size: 0.85em;
        cursor: pointer;
        outline: none;
    }

    /* TIMELINE — horizontal stepper / pipeline */
    #timeline {
        margin-bottom: 24px;
        padding: 16px 16px 12px;
        background: var(--glass-bg-elevated, var(--card-bg));
        border: 1px solid var(--glass-border, var(--card-border));
        border-radius: 10px;
        backdrop-filter: blur(var(--glass-blur, 0));
        -webkit-backdrop-filter: blur(var(--glass-blur, 0));
        box-shadow: var(--glass-shadow, none);
    }
    #timeline strong {
        display: block;
        margin-bottom: 14px;
        color: var(--text-muted);
        font-size: 0.85em;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .timeline-items {
        display: flex;
        align-items: flex-start;
        overflow-x: auto;
        padding: 0 0 4px;
        scrollbar-width: thin;
        scrollbar-color: var(--card-border) transparent;
    }
    /* Each step is a flex column: connector row + label row */
    .timeline-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1 1 0;
        min-width: 80px;
        position: relative;
    }
    /* Top row: horizontal line + centered dot */
    .timeline-step-track {
        display: flex;
        align-items: center;
        width: 100%;
        height: 36px;
        position: relative;
    }
    /* Connector lines on each side of the dot */
    .timeline-line-left,
    .timeline-line-right {
        flex: 1;
        height: 2px;
        background: var(--color-border-strong);
        transition: background 0.3s;
    }
    .timeline-step:first-child .timeline-line-left,
    .timeline-step:last-child .timeline-line-right {
        background: transparent;
    }
    .timeline-line-left.done,
    .timeline-line-right.done {
        background: var(--color-success);
    }
    /* The dot sits between the two lines */
    .timeline-dot {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2.5px solid var(--color-border-strong);
        background: var(--color-surface);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.65em;
        font-weight: 700;
        flex-shrink: 0;
        z-index: 1;
        transition: all 0.2s;
        cursor: pointer;
    }
    .timeline-dot:hover { transform: scale(1.15); }
    .timeline-dot.tl-done {
        background: var(--color-success);
        border-color: var(--color-success);
        color: #fff;
    }
    .timeline-dot.tl-inprogress {
        background: var(--color-surface);
        border-color: var(--color-warning);
        color: var(--color-warning);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-warning) 20%, transparent);
        animation: pulse 1.5s infinite;
    }
    .timeline-dot.tl-notstarted {
        background: var(--color-surface);
        border-color: var(--color-border-strong);
        color: var(--color-neutral);
    }
    .timeline-dot.tl-blocked {
        background: var(--color-surface);
        border-color: var(--color-danger);
        color: var(--color-danger);
    }
    .timeline-dot.tl-unneeded {
        background: var(--color-surface);
        border-color: var(--color-neutral-dim);
        color: var(--color-neutral-dim);
    }
    /* Labels below the dot */
    .timeline-info {
        text-align: center;
        padding-top: 6px;
        cursor: pointer;
    }
    .timeline-label {
        font-size: var(--text-xs);
        color: var(--text-muted);
        max-width: 90px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.3;
    }
    .timeline-count {
        font-size: 0.6em;
        color: var(--text-dim);
        font-family: var(--font-mono);
    }

    /* CATEGORY CARDS */
    .category {
        background: var(--glass-bg-elevated, var(--card-bg));
        border: 1px solid var(--glass-border, var(--card-border));
        border-radius: 10px;
        margin-bottom: 14px;
        overflow: hidden;
        transition: border-color 0.2s;
        backdrop-filter: blur(var(--glass-blur, 0));
        -webkit-backdrop-filter: blur(var(--glass-blur, 0));
        box-shadow: var(--glass-shadow, none);
    }
    .category:hover { border-color: var(--input-border); }
    .category-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        padding: 14px 18px;
        gap: 12px;
        user-select: none;
    }
    .category-header:hover { background: var(--card-hover); }
    .cat-left {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 0;
    }
    .cat-chevron {
        font-size: 0.7em;
        color: var(--text-dim);
        transition: transform 0.25s;
        flex-shrink: 0;
    }
    .cat-chevron.open { transform: rotate(90deg); }
    .cat-name {
        font-weight: 600;
        font-size: 0.95em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .cat-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }
    .cat-time {
        font-size: var(--text-xs);
        color: var(--text-dim);
        font-family: var(--font-mono);
    }
    .status-tag {
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 0.72em;
        font-weight: 600;
        white-space: nowrap;
    }
    .tag-done { background: var(--green-bg); color: var(--green-text); }
    .tag-inprogress { background: var(--amber-bg); color: var(--yellow); }
    .tag-notstarted { background: var(--red-bg); color: var(--red-text); }
    .tag-blocked { background: var(--blocked-bg); color: var(--blocked-tag-text); }
    .tag-unneeded { background: var(--unneeded-bg); color: var(--unneeded-tag-text); }

    .cat-progress {
        margin: 0 18px 0 18px;
        height: 5px;
        background: var(--bar-bg);
        border-radius: 5px;
        overflow: hidden;
    }
    .cat-progress-fill {
        height: 100%;
        transition: width 0.4s ease;
        border-radius: 5px;
    }

    /* TASK LIST — animated accordion */
    .tasks-wrapper {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.3s ease;
    }
    .tasks-wrapper.open {
        grid-template-rows: 1fr;
    }
    .tasks {
        overflow: hidden;
        padding: 0 18px;
    }
    .tasks-wrapper.open .tasks {
        padding: 4px 18px 14px;
    }

    .task-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 12px;
        margin: 3px 0;
        border-radius: 6px;
        background: var(--row-bg);
        border: 1px solid var(--row-border);
        transition: background 0.15s;
        cursor: default;
    }
    .task-row:hover { background: var(--row-hover); }
    .task-row.completed { opacity: 0.6; }

    .task-status-btn {
        margin-top: 2px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid var(--input-border);
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.65em;
        font-weight: bold;
        transition: all 0.15s;
        user-select: none;
    }
    .task-status-btn { position: relative; }
    .task-status-btn:hover { transform: scale(1.15); }
    .task-status-btn.s-notstarted { background: var(--btn-notstarted-bg); border-color: var(--btn-notstarted-border); color: var(--btn-notstarted-color); }
    .task-status-btn.s-inprogress { background: var(--btn-inprog-bg); border-color: var(--btn-inprog-border); color: var(--btn-inprog-color); }
    .task-status-btn.s-done { background: var(--btn-done-bg); border-color: var(--btn-done-border); color: var(--btn-done-color); }
    .task-status-btn.s-blocked { background: var(--btn-blocked-bg); border-color: var(--btn-blocked-border); color: var(--btn-blocked-color); }
    .task-status-btn.s-unneeded { background: var(--btn-unneeded-bg); border-color: var(--btn-unneeded-border); color: var(--btn-unneeded-color); }

    /* Status dropdown popup */
    .status-popup {
        position: absolute;
        top: 0; left: 28px;
        background: var(--glass-bg-elevated, var(--card-bg));
        border: 1px solid var(--glass-border, var(--card-border));
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.35);
        z-index: 100;
        padding: 4px;
        display: flex;
        gap: 4px;
        white-space: nowrap;
        backdrop-filter: blur(var(--glass-blur, 0));
        -webkit-backdrop-filter: blur(var(--glass-blur, 0));
    }
    .status-popup .sp-opt {
        width: 24px; height: 24px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.65em; font-weight: bold;
        transition: transform 0.12s;
    }
    .status-popup .sp-opt:hover { transform: scale(1.25); }
    .status-popup .sp-opt.sp-notstarted { background: var(--btn-notstarted-bg); border-color: var(--btn-notstarted-border); color: var(--btn-notstarted-color); }
    .status-popup .sp-opt.sp-inprogress { background: var(--btn-inprog-bg); border-color: var(--btn-inprog-border); color: var(--btn-inprog-color); }
    .status-popup .sp-opt.sp-done { background: var(--btn-done-bg); border-color: var(--btn-done-border); color: var(--btn-done-color); }
    .status-popup .sp-opt.sp-blocked { background: var(--btn-blocked-bg); border-color: var(--btn-blocked-border); color: var(--btn-blocked-color); }
    .status-popup .sp-opt.sp-unneeded { background: var(--btn-unneeded-bg); border-color: var(--btn-unneeded-border); color: var(--btn-unneeded-color); }

    /* Category complete-all button */
    .cat-complete-all {
        padding: 2px 8px;
        border-radius: 5px;
        font-size: 0.68em;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--green-text);
        background: var(--green-bg);
        color: var(--green-text);
        white-space: nowrap;
        transition: filter 0.15s;
    }
    .cat-complete-all:hover { filter: brightness(1.3); }

    /* Reset button */
    .reset-zone {
        margin-top: 40px;
        padding: 20px 0;
        text-align: center;
        border-top: 1px solid var(--card-border);
    }
    .reset-btn {
        padding: 8px 24px;
        border-radius: 6px;
        font-size: 0.8em;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid #c62828;
        background: transparent;
        color: #c62828;
        opacity: 0.6;
        transition: all 0.2s;
    }
    .reset-btn:hover { background: #c62828; color: #fff; opacity: 1; }

    .task-content {
        flex: 1;
        min-width: 0;
    }
    .task-item-label {
        display: inline-block;
        background: var(--row-border);
        color: var(--item-label-color);
        padding: 1px 8px;
        border-radius: 4px;
        font-size: 0.72em;
        margin-right: 6px;
        font-weight: 600;
    }
    .task-text {
        font-size: 0.88em;
        white-space: pre-line;
        word-break: break-word;
    }
    .task-row.completed .task-text {
        text-decoration: line-through;
        color: var(--completed-text);
    }
    .task-row.blocked .task-text {
        text-decoration: line-through;
        color: var(--blocked-text);
    }
    .task-row.blocked { opacity: 0.7; }
    .task-row.unneeded .task-text {
        text-decoration: line-through;
        color: var(--unneeded-text);
    }
    .task-row.unneeded { opacity: 0.5; }

    /* ── v2 task field badges ─────────────────────────── */
    .task-id-badge {
        display: inline-block; font-family: Consolas, monospace; font-size: 0.68em;
        background: rgba(255, 210, 50, 0.15); color: #ffd232;
        border: 1px solid rgba(255, 210, 50, 0.45);
        padding: 1px 6px; border-radius: 3px; margin-right: 5px; font-weight: 700; vertical-align: middle;
    }
    [data-theme="light"] .task-id-badge {
        background: rgba(180, 130, 0, 0.12); color: #a07800;
        border-color: rgba(180, 130, 0, 0.4);
    }
    .task-system-tag {
        display: inline-block; font-size: 0.7em;
        color: #29b6d4; border: 1px solid rgba(41,182,212,0.6);
        padding: 0 7px; border-radius: 10px; margin-left: 6px; font-weight: 600; vertical-align: middle;
    }
    [data-theme="light"] .task-system-tag {
        color: #0277bd; border-color: rgba(2,119,189,0.5);
    }
    .task-party {
        display: inline-block; font-size: 0.68em;
        padding: 1px 7px; border-radius: 10px; color: #fff;
        margin-left: 5px; font-weight: 600; vertical-align: middle;
    }
    .task-overrun { color: #e65100; font-size: 0.78em; margin-left: 3px; font-weight: 600; }
    .task-ahead   { color: #4caf50; font-size: 0.78em; margin-left: 3px; font-weight: 600; }
    .task-comment {
        font-size: 0.8em; color: var(--text-dim);
        background: rgba(255,183,77,0.06); border-left: 2px solid rgba(255,183,77,0.6);
        padding: 3px 8px; margin-top: 4px; border-radius: 0 4px 4px 0;
        white-space: pre-wrap; word-break: break-word; display: block;
    }
    .task-comment-btn {
        display: inline-flex; align-items: center; gap: 3px;
        font-size: 0.7em; cursor: pointer; margin-left: 6px;
        color: #ffb74d; border: 1px solid rgba(255,183,77,0.55);
        border-radius: 10px; padding: 1px 7px;
        opacity: 0.7; transition: opacity 0.15s, background 0.15s;
        vertical-align: middle; user-select: none; font-weight: 600;
    }
    .task-comment-btn:hover { opacity: 1; background: rgba(255,183,77,0.1); }
    [data-theme="light"] .task-comment-btn {
        color: #e65100; border-color: rgba(230,81,0,0.45);
    }
    [data-theme="light"] .task-comment-btn:hover { background: rgba(230,81,0,0.07); }
    .task-time-end {
        cursor: pointer; border-bottom: 1px dashed rgba(255,255,255,0.3);
        padding-bottom: 1px; transition: color 0.15s;
        font-size: var(--text-xs); font-family: var(--font-mono); color: var(--text-dim); white-space: nowrap;
    }
    [data-theme="light"] .task-time-end { border-bottom-color: rgba(0,0,0,0.3); }
    .task-time-end:hover { color: var(--text); border-bottom-color: var(--text-dim); }
    .task-time-edit {
        width: 160px; font-size: 0.78em; background: var(--input-bg); color: var(--text);
        border: 1px solid var(--color-primary); border-radius: 4px; padding: 2px 6px;
    }
    .task-comment-edit {
        font-size: 0.82em; width: calc(100% - 18px); min-height: 52px; margin-top: 4px;
        resize: vertical; background: var(--input-bg); color: var(--text);
        border: 1px solid var(--color-primary); border-radius: 4px; padding: 4px 8px; display: block;
    }

    .task-meta {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
    }
    .task-time {
        font-size: var(--text-xs);
        color: var(--text-dim);
        font-family: var(--font-mono);
        white-space: nowrap;
    }
    .task-status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
    }
    .dot-done { background: var(--dot-done); }
    .dot-inprogress { background: var(--dot-inprog); animation: pulse 1.5s infinite; }
    .dot-notstarted { background: var(--dot-notstarted); }
    .dot-blocked { background: var(--dot-blocked); }
    .dot-unneeded { background: var(--dot-unneeded); }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
    }

    /* ACTIONS — grouped button bar */
    .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        flex-wrap: wrap;
        align-items: center;
    }
    .action-group {
        display: flex;
        gap: 6px;
        align-items: center;
    }
    .action-group-label {
        font-size: var(--text-xs);
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-right: 2px;
        white-space: nowrap;
    }
    .action-divider {
        width: 1px;
        height: 28px;
        background: var(--card-border);
        margin: 0 4px;
    }
    /* Export dropdown */
    .export-dropdown {
        position: relative;
    }
    .export-dropdown-trigger {
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .export-dropdown-trigger::after {
        content: '▾';
        font-size: 0.7em;
    }
    .export-dropdown-menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        min-width: 180px;
        background: var(--glass-bg-elevated, var(--card-bg));
        border: 1px solid var(--glass-border, var(--card-border));
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        z-index: 50;
        padding: 4px;
        display: none;
        backdrop-filter: blur(var(--glass-blur, 0));
        -webkit-backdrop-filter: blur(var(--glass-blur, 0));
    }
    .export-dropdown-menu.open {
        display: block;
    }
    .export-dropdown-menu button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px 12px;
        background: none;
        border: none;
        border-radius: 6px;
        color: var(--text-muted);
        font-size: var(--text-sm);
        font-family: inherit;
        cursor: pointer;
        text-align: left;
        transition: background 0.15s, color 0.15s;
    }
    .export-dropdown-menu button:hover {
        background: var(--card-hover);
        color: var(--text);
    }
    /* View toggle (expand/collapse) */
    .view-toggle-btn {
        background: var(--action-bg);
        border: 1px solid var(--action-border);
        padding: 6px 8px;
        color: var(--text-muted);
        cursor: pointer;
        border-radius: 6px;
        font-size: 1em;
        line-height: 1;
        transition: all 0.2s;
    }
    .view-toggle-btn:hover { background: var(--card-hover); color: var(--text); border-color: var(--text-dim); }
    .view-toggle-btn:focus-visible { outline: 2px solid var(--color-info); outline-offset: 2px; }
    .action-btn {
        background: var(--action-bg);
        border: 1px solid var(--action-border);
        padding: 10px 18px;
        color: var(--text-muted);
        cursor: pointer;
        border-radius: 8px;
        font-size: 0.85em;
        transition: all 0.2s;
    }
    .action-btn:hover { background: var(--card-hover); color: var(--text); border-color: var(--text-dim); }
    .action-btn.primary { background: var(--green-bg); border-color: var(--green-text); color: var(--green-text); }
    .action-btn.primary:hover { background: var(--green-bg); filter: brightness(1.2); }
    .action-btn.share { background: var(--card-bg); border-color: var(--blue); color: var(--blue); }
    .action-btn.share:hover { filter: brightness(1.1); }

    #snapshot-area {
        padding: 20px 30px 16px;
        margin: -20px -30px 0;
    }

    /* SUMMARY */
    #summaryBox {
        margin-top: 16px;
        padding: 0;
        background: var(--glass-bg-elevated, var(--card-bg));
        border: 1px solid var(--glass-border, var(--card-border));
        border-radius: 10px;
        font-size: 0.9em;
        display: none;
        overflow: hidden;
        backdrop-filter: blur(var(--glass-blur, 0));
        -webkit-backdrop-filter: blur(var(--glass-blur, 0));
        box-shadow: var(--glass-shadow, none);
    }
    #summaryBox .summary-toolbar {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--card-border);
        background: var(--row-bg);
    }
    #summaryBox .summary-toolbar button {
        padding: 4px 14px;
        border-radius: 5px;
        border: 1px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--text-muted);
        cursor: pointer;
        font-size: 0.82em;
    }
    #summaryBox .summary-toolbar button:hover { background: var(--card-hover); }
    #summaryBox .summary-toolbar button.copy-btn { border-color: var(--green-text); color: var(--green-text); background: var(--green-bg); }
    #summaryBox .summary-body {
        padding: 16px;
    }

    /* TOAST */
    .toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: var(--toast-bg);
        color: var(--toast-text);
        border: 1px solid var(--toast-border);
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 0.85em;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.3s;
        pointer-events: none;
        z-index: 100;
    }
    .toast.show {
        opacity: 1;
        transform: translateY(0);
    }

    /* CONFIRMATION MODAL */
    .confirm-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        animation: fadeIn 0.15s ease;
    }
    .confirm-dialog {
        background: var(--glass-bg-elevated, var(--card-bg));
        border: 1px solid var(--glass-border, var(--card-border));
        border-radius: 12px;
        padding: 24px;
        min-width: 320px;
        max-width: 440px;
        box-shadow: 0 16px 48px rgba(0,0,0,0.5);
        animation: slideUp 0.2s ease;
        backdrop-filter: blur(calc(var(--glass-blur, 0) * 1.5));
        -webkit-backdrop-filter: blur(calc(var(--glass-blur, 0) * 1.5));
    }
    .confirm-dialog h3 {
        margin: 0 0 8px;
        font-size: var(--text-lg);
        color: var(--text);
    }
    .confirm-dialog p {
        margin: 0 0 20px;
        font-size: var(--text-sm);
        color: var(--text-muted);
        line-height: 1.5;
    }
    .confirm-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
    }
    .confirm-btn {
        padding: 8px 20px;
        border-radius: 6px;
        font-size: var(--text-sm);
        font-family: inherit;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--card-border);
        background: var(--btn-bg);
        color: var(--text-muted);
        transition: all 0.15s;
    }
    .confirm-btn:hover { background: var(--card-hover); color: var(--text); }
    .confirm-btn.danger {
        background: var(--color-danger-bg);
        border-color: var(--color-danger);
        color: var(--color-danger-text);
    }
    .confirm-btn.danger:hover { filter: brightness(1.2); }
    @keyframes slideUp {
        from { transform: translateY(16px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* NO RESULTS */
    .no-results {
        text-align: center;
        padding: 40px;
        color: var(--text-dim);
        font-size: 0.95em;
    }

    /* ASSIGNEE */
    .task-assignee {
        display: inline-block;
        background: var(--card-border);
        color: var(--blue);
        padding: 1px 8px;
        border-radius: 4px;
        font-size: 0.68em;
        font-weight: 500;
        white-space: nowrap;
        max-width: 160px;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
        transition: background 0.15s;
        vertical-align: middle;
    }
    .task-assignee:hover { background: var(--input-border); }
    .task-assignee-edit {
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid var(--blue);
        background: var(--input-bg);
        color: var(--text);
        font-size: 0.72em;
        font-family: inherit;
        outline: none;
        width: 140px;
    }
    .team-select {
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid var(--input-border);
        background: var(--input-bg);
        color: var(--text);
        font-size: 0.85em;
        cursor: pointer;
        outline: none;
    }

    /* TIME INDICATOR */
    .time-overdue { color: var(--pink) !important; }
    .time-current { color: var(--yellow) !important; }
    .time-upcoming { color: var(--blue) !important; }

    /* ISSUES PANEL */
    .issues-panel {
        background: var(--glass-bg-elevated, var(--card-bg));
        border: 1px solid var(--glass-border, var(--card-border));
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 20px;
        backdrop-filter: blur(var(--glass-blur, 0));
        -webkit-backdrop-filter: blur(var(--glass-blur, 0));
        box-shadow: var(--glass-shadow, none);
    }
    .issues-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        cursor: pointer;
        user-select: none;
    }
    .iss-chevron {
        font-size: 0.7em;
        color: var(--text-dim);
        transition: transform 0.25s;
        display: inline-block;
    }
    .iss-chevron.open { transform: rotate(90deg); }
    .issues-header h2 {
        margin: 0;
        font-size: 1em;
        color: var(--orange);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .issues-count {
        background: var(--amber-bg);
        color: var(--orange);
        padding: 2px 10px;
        border-radius: 10px;
        font-size: 0.75em;
        font-weight: 600;
    }
    .issue-add-form-wrapper {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.3s ease;
    }
    .issue-add-form-wrapper.open {
        grid-template-rows: 1fr;
    }
    .issue-add-form {
        overflow: hidden;
        background: var(--issue-form-bg);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        margin-bottom: 14px;
    }
    .issue-add-form-wrapper.open .issue-add-form {
        padding: 14px;
    }
    .issue-form-row {
        display: flex;
        gap: 10px;
        margin-bottom: 8px;
        flex-wrap: wrap;
    }
    .issue-form-row label {
        font-size: 0.75em;
        color: var(--text-muted);
        display: block;
        margin-bottom: 3px;
    }
    .issue-field {
        flex: 1;
        min-width: 140px;
    }
    .issue-field input, .issue-field select, .issue-field textarea {
        width: 100%;
        padding: 7px 10px;
        border-radius: 6px;
        border: 1px solid var(--input-border);
        background: var(--input-bg);
        color: var(--text);
        font-size: 0.82em;
        font-family: inherit;
        outline: none;
    }
    .issue-field textarea {
        resize: vertical;
        min-height: 50px;
    }
    .issue-field input:focus, .issue-field select:focus, .issue-field textarea:focus {
        border-color: var(--orange);
    }
    .issue-form-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
    }
    .issue-btn {
        padding: 6px 16px;
        border-radius: 6px;
        border: 1px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--text-muted);
        cursor: pointer;
        font-size: 0.82em;
    }
    .issue-btn.save { background: var(--amber-bg); border-color: var(--orange); color: var(--orange); }
    .issue-btn.save:hover { background: var(--amber-bg); filter: brightness(1.2); }

    .issue-card {
        background: var(--issue-form-bg);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 8px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
    }
    .issue-card .issue-severity {
        width: 6px;
        min-height: 40px;
        border-radius: 3px;
        flex-shrink: 0;
        margin-top: 2px;
    }
    .issue-severity.blocking { background: var(--health-red); }
    .issue-severity.non-blocking { background: var(--health-amber); }
    .issue-body { flex: 1; min-width: 0; }
    .issue-title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
    }
    .issue-desc {
        font-size: 0.88em;
        font-weight: 600;
        color: var(--text);
        word-break: break-word;
    }
    .issue-tags {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
        align-items: center;
    }
    .issue-tag {
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.68em;
        font-weight: 600;
    }
    .issue-tag.blocking { background: var(--red-bg); color: var(--red-text); }
    .issue-tag.non-blocking { background: var(--amber-bg); color: var(--yellow); }
    .issue-tag.ongoing { background: var(--amber-bg); color: var(--yellow); }
    .issue-tag.closed { background: var(--green-bg); color: var(--green-text); }
    .issue-meta {
        font-size: 0.72em;
        color: var(--text-dim);
        margin-top: 4px;
    }
    .issue-meta span { margin-right: 12px; }
    .issue-actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
    }
    .issue-actions button {
        padding: 3px 10px;
        border-radius: 4px;
        border: 1px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--text-muted);
        cursor: pointer;
        font-size: 0.72em;
    }
    .issue-actions button:hover { color: var(--text); border-color: var(--text-dim); }
    .issue-actions button.close-btn { color: var(--green-text); }
    .issue-actions button.reopen-btn { color: var(--yellow); }
    .issue-actions button.del-btn { color: var(--pink); }

    /* THEME TOGGLE */
    .theme-toggle {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        width: 48px;
        height: 26px;
        cursor: pointer;
        display: flex;
        align-items: center;
        padding: 2px;
        transition: background 0.3s;
    }
    .theme-toggle-knob {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--text);
        transition: transform 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
    }
    [data-theme="light"] .theme-toggle-knob {
        transform: translateX(22px);
    }
    .theme-toggle-label {
        font-size: 0.7em;
        color: var(--text-muted);
        margin-right: 8px;
    }
    .theme-toggle-wrap {
        position: absolute;
        top: 20px;
        right: 30px;
        display: none;
        align-items: center;
        gap: 6px;
        z-index: 10;
    }

    /* PALETTE TOGGLE */
    .palette-btn {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
        font-size: 0.72em;
        color: var(--text-muted);
        transition: all 0.2s;
        white-space: nowrap;
        margin-right: 8px;
    }
    .palette-btn:hover { background: var(--card-hover); color: var(--text); border-color: var(--text-dim); }

    /* HEALTH-BASED PROGRESS GRADIENT (CSS-driven) */
    .stats-master.health-green .progress-fill { background: linear-gradient(90deg, var(--color-success), var(--color-info)); }
    .stats-master.health-amber .progress-fill { background: linear-gradient(90deg, var(--color-warning), var(--color-issues)); }
    .stats-master.health-red .progress-fill { background: linear-gradient(90deg, var(--color-issues), var(--color-danger)); }

    /* PAGE LOAD ANIMATIONS */
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes progressGrow {
        from { width: 0 !important; }
    }
    .anim-fade-in {
        animation: fadeInUp 0.4s ease both;
    }
    .stat-card { animation: fadeInUp 0.35s ease both; }
    .stat-card:nth-child(1) { animation-delay: 0.05s; }
    .stat-card:nth-child(2) { animation-delay: 0.1s; }
    .stat-card:nth-child(3) { animation-delay: 0.15s; }
    .stat-card:nth-child(4) { animation-delay: 0.2s; }
    .stat-card:nth-child(5) { animation-delay: 0.25s; }
    .stat-card:nth-child(6) { animation-delay: 0.3s; }
    .category {
        animation: fadeInUp 0.35s ease both;
    }
    .category:nth-child(1) { animation-delay: 0.05s; }
    .category:nth-child(2) { animation-delay: 0.1s; }
    .category:nth-child(3) { animation-delay: 0.15s; }
    .category:nth-child(4) { animation-delay: 0.2s; }
    .category:nth-child(5) { animation-delay: 0.25s; }
    .category:nth-child(6) { animation-delay: 0.3s; }
    .category:nth-child(7) { animation-delay: 0.35s; }
    .category:nth-child(8) { animation-delay: 0.4s; }
    .category:nth-child(n+9) { animation-delay: 0.45s; }
    .stats-master .progress-fill {
        animation: progressGrow 0.8s ease both;
        animation-delay: 0.2s;
    }
    .timeline-step {
        animation: fadeInUp 0.3s ease both;
    }
    .timeline-step:nth-child(1) { animation-delay: 0.05s; }
    .timeline-step:nth-child(2) { animation-delay: 0.08s; }
    .timeline-step:nth-child(3) { animation-delay: 0.11s; }
    .timeline-step:nth-child(4) { animation-delay: 0.14s; }
    .timeline-step:nth-child(5) { animation-delay: 0.17s; }
    .timeline-step:nth-child(6) { animation-delay: 0.20s; }
    .timeline-step:nth-child(7) { animation-delay: 0.23s; }
    .timeline-step:nth-child(8) { animation-delay: 0.26s; }
    .timeline-step:nth-child(n+9) { animation-delay: 0.29s; }

    /* After initial load, suppress intro animations on re-renders */
    html.loaded .stat-card,
    html.loaded .category,
    html.loaded .timeline-step { animation: none; }
    html.loaded .stats-master .progress-fill { animation: none; }

    /* LOADING SKELETON */
    @keyframes skeletonShimmer {
        0% { background-position: -400px 0; }
        100% { background-position: 400px 0; }
    }
    .skeleton {
        animation: skeletonShimmer 1.5s ease-in-out infinite;
        background: linear-gradient(90deg, var(--card-bg) 25%, var(--card-hover) 50%, var(--card-bg) 75%);
        background-size: 800px 100%;
        border-radius: 10px;
    }
    .skeleton-stats {
        height: 52px;
        margin-bottom: 16px;
        border: 1px solid var(--card-border);
    }
    .skeleton-stats-row {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
    }
    .skeleton-stat-card {
        flex: 1;
        height: 72px;
        border: 1px solid var(--card-border);
    }
    .skeleton-timeline {
        height: 80px;
        margin-bottom: 24px;
        border: 1px solid var(--card-border);
    }
    .skeleton-category {
        height: 60px;
        margin-bottom: 14px;
        border: 1px solid var(--card-border);
    }

    /* ═══ RESPONSIVE — TABLET ═══ */
    @media (max-width: 768px) {
        body { padding: 12px 16px; }
        .header { gap: 10px; padding: 10px 12px; }
        .header h1 { font-size: var(--text-base); }
        .header-left { flex: 1 1 200px; }
        .header-center { order: 3; flex-basis: 100%; justify-content: center; }
        .header-right { gap: 6px; }
        .health-dot { min-width: 32px; height: 28px; font-size: 0.6em; padding: 0 6px; }
        .stats-groups { flex-direction: column; }
        .stat-card { padding: 10px 12px; }
        .stat-card .stat-value { font-size: var(--text-lg); }
        .controls { gap: 6px; }
        .filter-group { flex-wrap: wrap; }
        .filterBtn { padding: 5px 10px; font-size: var(--text-xs); }
        .search-box { min-width: 150px; max-width: none; flex: 1; }
        .timeline-connector { width: 18px; }
        .timeline-label { max-width: 60px; font-size: 0.58em; }
        .actions { gap: 6px; }
        .action-btn { padding: 8px 12px; font-size: 0.8em; }
        .action-divider { margin: 0 2px; }
    }

    /* ═══ RESPONSIVE — MOBILE ═══ */
    @media (max-width: 480px) {
        body { padding: 8px 10px; }
        .header { padding: 8px 10px; gap: 8px; }
        .header h1 { font-size: var(--text-sm); }
        .client-logo { width: 32px; height: 32px; }
        .header-center { order: 3; flex-basis: 100%; }
        .header-right { flex-basis: 100%; justify-content: flex-end; order: 2; }
        .health-label { display: none; }
        .stats-master { height: 44px; }
        .stats-master .master-pct { font-size: var(--text-xl); }
        .stats-master .master-detail { font-size: 0.8em; }
        .stat-card { padding: 8px 6px; }
        .stat-card .stat-value { font-size: var(--text-md); }
        .stat-card .stat-label { font-size: 0.58em; }
        .controls { flex-direction: column; align-items: stretch; }
        .filter-group { justify-content: center; }
        .filterBtn { min-height: 44px; padding: 8px 10px; }
        .search-box { min-width: 0; max-width: none; }
        .sort-select, .team-select { width: 100%; }
        .timeline-items { padding: 4px 0 8px; }
        .timeline-connector { width: 12px; }
        .timeline-dot { width: 22px; height: 22px; font-size: 0.5em; }
        .timeline-label { max-width: 50px; font-size: 0.55em; }
        .category-header { padding: 10px 12px; }
        .cat-name { font-size: 0.85em; }
        .task-row { padding: 8px 10px; gap: 8px; }
        .task-assignee { max-width: 100px; }
        .actions { flex-direction: column; }
        .action-group { flex-wrap: wrap; justify-content: center; }
        .action-divider { width: 100%; height: 1px; margin: 2px 0; }
        .action-btn { min-height: 44px; }
        .view-toggle-btn { min-height: 44px; min-width: 44px; }
        .issue-form-row { flex-direction: column; }
        .issue-field { min-width: 0; }
    }
</style>
</head>

<body>

<div class="theme-toggle-wrap" id="headerToggles" style="display:none">
    <button class="palette-btn" id="paletteToggle" title="Switch color palette">Corporate</button>
    <span class="theme-toggle-label">🌙</span>
    <div class="theme-toggle" id="themeToggle" title="Toggle light/dark mode">
        <div class="theme-toggle-knob"></div>
    </div>
    <span class="theme-toggle-label">☀️</span>
</div>

<div class="bg-overlay" id="bgOverlay"></div>

<div id="snapshot-area">

<div class="header">
    <div class="header-left">
        <img id="clientLogo" class="client-logo hidden" alt="Client Logo">
        <div class="header-info">
            <h1>Go-Live Runbook</h1>
            <div class="subtitle"></div>
        </div>
    </div>
    <div class="header-center">
        <div class="health-bar">
            <span class="health-label">Health:</span>
            <div class="health-indicator">
                <div class="health-dot green" data-health="Green" title="Green - On Track">GO</div>
                <div class="health-dot amber" data-health="Amber" title="Amber - At Risk">AT RISK</div>
                <div class="health-dot red" data-health="Red" title="Red - Rollback">STOP</div>
            </div>
            <span class="health-text" id="healthText"></span>
        </div>
    </div>
    <div class="header-right">
        <div class="clock" id="clock"></div>
        <button class="palette-btn" id="paletteToggle2" title="Switch color palette">Corporate</button>
        <div class="theme-toggle" id="themeToggle2" title="Toggle light/dark mode">
            <div class="theme-toggle-knob"></div>
        </div>
    </div>
</div>

<div class="global-stats" id="globalStats">
    <div class="skeleton skeleton-stats"></div>
    <div class="skeleton-stats-row">
        <div class="skeleton skeleton-stat-card"></div>
        <div class="skeleton skeleton-stat-card"></div>
        <div class="skeleton skeleton-stat-card"></div>
        <div class="skeleton skeleton-stat-card"></div>
    </div>
</div>

<div id="timeline">
    <div class="skeleton skeleton-timeline"></div>
</div>

</div><!-- end snapshot-area -->

<div class="controls" id="controlsBar">
    <div class="filter-group" role="group" aria-label="Filter tasks by status">
        <button class="filterBtn active" data-filter="all" aria-pressed="true">All</button>
        <button class="filterBtn" data-filter="done" aria-pressed="false">Completed</button>
        <button class="filterBtn" data-filter="inprogress" aria-pressed="false">In Progress</button>
        <button class="filterBtn" data-filter="notstarted" aria-pressed="false">Not Started</button>
        <button class="filterBtn" data-filter="blocked" aria-pressed="false">Blocked</button>
        <button class="filterBtn" data-filter="unneeded" aria-pressed="false">Unneeded</button>
    </div>
    <input type="text" class="search-box" id="searchBox" placeholder="Search tasks...">
    <select class="team-select" id="teamFilter">
        <option value="all">All Teams</option>
    </select>
    <select class="team-select" id="systemFilter" style="display:none">
        <option value="all">All Systems</option>
    </select>
    <select class="sort-select" id="sortSelect">
        <option value="timeline">Sort: Timeline</option>
        <option value="completion">Sort: Completion %</option>
        <option value="alpha">Sort: A-Z</option>
    </select>
</div>

<div id="issuesPanel"></div>

<div id="container">
    <div class="skeleton skeleton-category"></div>
    <div class="skeleton skeleton-category"></div>
    <div class="skeleton skeleton-category"></div>
    <div class="skeleton skeleton-category"></div>
    <div class="skeleton skeleton-category"></div>
</div>

<div class="actions">
    <div class="action-group">
        <button class="action-btn primary" data-action="save">Save Progress</button>
    </div>
    <div class="action-divider"></div>
    <div class="action-group">
        <button class="action-btn" data-action="reload">Reload</button>
        <button class="action-btn" data-action="load-file">Load File</button>
    </div>
    <div class="action-divider"></div>
    <div class="action-group">
        <div class="export-dropdown" id="exportDropdown">
            <button class="action-btn share export-dropdown-trigger" data-action="export-menu">Export</button>
            <div class="export-dropdown-menu" id="exportMenu">
                <button data-action="phone-export"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>Phone Image</button>
                <button data-action="email-export"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22,4 12,13 2,4"/></svg>Email Image</button>
                <button data-action="gantt-export"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="20" y2="10"/><line x1="6" y1="14" x2="18" y2="14"/><line x1="4" y1="18" x2="14" y2="18"/><line x1="2" y1="3" x2="2" y2="21"/></svg>Gantt Chart</button>
                <button data-action="export-json"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Export JSON</button>
                <button data-action="summary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>Summary</button>
                <button data-action="final-report"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>Final Report</button>
            </div>

      if (cs.catPct > 0) drawRoundRect(ctx, mpX, mpY, Math.max(8, mpW * cs.catPct / 100), mpH, 4, theme.dot);
      drawText(ctx, cs.catPct + "%", rowX + rowW - 45, Y + 37, "bold 24px Segoe UI, sans-serif", theme.text, "center");

    });
    const activeList = getActiveAssignees(sortedCats);

        const ty = Y + row * 34;
        drawRoundRect(ctx, tx, ty, tagW2 - 10, 28, 6, "#111122", "#333355");
        drawText(ctx, entry[0], tx + 10, ty + 19, "18px Segoe UI, sans-serif", "#5bc0ff", "left");
        drawText(ctx, entry[1] + " active", tx + tagW2 - 20, ty + 19, "bold 16px Segoe UI, sans-serif", "#ffd84a", "right");
      });
      Y += Math.ceil(Math.min(activeList.length, 8) / cols2) * 34 + 6;
      if (activeList.length > 8) {
        drawText(ctx, `... and ${activeList.length - 8} more`, W4 / 2, Y + 10, "18px Segoe UI, sans-serif", "#555555");
        Y += 24;
      }
    }
    const issueFilter = getIssueFilter("phone");
    const { openIssues, displayList: allIssues } = getExportIssues(issueFilter);
    if (allIssues.length > 0) {
      Y += 30;
      drawDivider(ctx, 60, W4 - 60, Y);
      Y += 36;
      const blockingOpen = openIssues.filter((i) => i.severity === ISSUE_SEVERITY.BLOCKING).length;
      let issueTitle = `ISSUES LOG (${openIssues.length} open`;
      if (blockingOpen > 0) issueTitle += ` / ${blockingOpen} blocking`;
      issueTitle += ")";
      drawText(ctx, issueTitle, W4 / 2, Y, "bold 24px Segoe UI, sans-serif", "#ff9944");
      Y += 16;
      allIssues.forEach((iss) => {
        if (Y > H3 - 100) return;
        Y += 8;
        const iRowX = 80, iRowW = W4 - 160, iRowH = 66;
        const isOpen = iss.issueStatus === ISSUE_STATUS.ONGOING;
        const isBlocking = iss.severity === ISSUE_SEVERITY.BLOCKING;
        drawRoundRect(ctx, iRowX, Y, iRowW, iRowH, 8, "#0d0d12", "#222222");
        drawRoundRect(ctx, iRowX + 6, Y + 8, 5, iRowH - 16, 3, isBlocking ? "#ff3333" : "#ffa500");
        const descStr = iss.description.length > 55 ? iss.description.substring(0, 52) + "..." : iss.description;
        const descColor = isOpen ? "#eeeeee" : "#888888";
        const descFont = isOpen ? "bold 22px Segoe UI, sans-serif" : "22px Segoe UI, sans-serif";
        drawText(ctx, descStr, iRowX + 24, Y + 26, descFont, descColor, "left");
        drawText(ctx, `${iss.category}  \xB7  ${iss.time}`, iRowX + 24, Y + 50, "18px Segoe UI, sans-serif", "#666666", "left");
        const stTag = isOpen ? ISSUE_STATUS.ONGOING.toUpperCase() : ISSUE_STATUS.CLOSED.toUpperCase();
        const stColor = isOpen ? "#ffd84a" : "#7bff7b";
        const sevTag = isBlocking ? ISSUE_SEVERITY.BLOCKING.toUpperCase() : ISSUE_SEVERITY.NON_BLOCKING.toUpperCase();

  // dashboard/export/gantt.js
  function exportGanttChart(showToast2) {
    showToast2("Generating Gantt chart...");
    const project = getProjectInfo();
    const { logoImg } = getExportAssets();
    const health = getHealthStatus();
    const hMeta = HEALTH_LIGHT[health];
    const stats = getExportStats();
    const sortedCats = getExportCategories();
    const timeBounds = getTimeBounds(sortedCats);
    if (!timeBounds) {
      showToast2("No time data available for Gantt chart");
      return;
    }
    const { globalMin, globalMax, span } = timeBounds;
    const W4 = 1920, labelW = 340, rightPad = 60, chartX = labelW, chartW = W4 - labelW - rightPad;
    const topH = 140, axisH = 60;
    const rowH = 72, rowGap = 6;
    const contentH = sortedCats.length * (rowH + rowGap) + 40;
    const legendH = 60;
    const H3 = topH + axisH + contentH + legendH + 40;
    const cv = document.createElement("canvas");
    cv.width = W4;
    cv.height = H3;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W4, H3);
    ctx.fillStyle = project.accentColor;
    ctx.fillRect(0, 0, W4, 70);
    if (logoImg) {
      const lS = 46;
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(16, 12, lS, lS, 7);
      ctx.clip();
      ctx.drawImage(logoImg, 16, 12, lS, lS);
      ctx.restore();
    }
    drawText(ctx, project.projectName.toUpperCase() + " \u2014 GANTT CHART", W4 / 2, 44, "bold 28px Segoe UI, sans-serif", "#ffffff", "center");
    ctx.fillStyle = "#f4f5f7";
    ctx.fillRect(0, 70, W4, 36);
    drawText(ctx, [project.subtitle, project.changeRef, formatExportTimestamp()].filter(Boolean).join("  |  "), W4 / 2, 94, "18px Segoe UI, sans-serif", "#555555", "center");
    ctx.fillStyle = project.accentColor;
    ctx.fillRect(0, 106, W4, 3);
    drawRoundRect(ctx, 20, 114, 220, 30, 15, hMeta.bg, hMeta.color);
    drawDot(ctx, 38, 129, 6, hMeta.color);
    drawText(ctx, "GO-LIVE: " + hMeta.label, 130, 135, "bold 14px Segoe UI, sans-serif", hMeta.color, "center");
    drawText(ctx, `${stats.done}/${stats.total} completed (${stats.pct}%)  |  ${stats.blocking} ${statusLabel(STATUS.BLOCKING).toLowerCase()}`, W4 - rightPad, 135, "bold 14px Segoe UI, sans-serif", "#555", "right");
    const axisY = topH;
    ctx.fillStyle = "#f8f8f8";
    ctx.fillRect(chartX, axisY, chartW, axisH);
    ctx.strokeStyle = "#e0e0e0";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(chartX, axisY + axisH);
    ctx.lineTo(chartX + chartW, axisY + axisH);
    ctx.stroke();
    const startDate = new Date(globalMin);
    startDate.setMinutes(0, 0, 0);
    const tickInterval = 36e5 * 3;
    let tick = startDate.getTime();
    while (tick <= globalMax) {
      const x = chartX + (tick - globalMin) / span * chartW;
      if (x >= chartX && x <= chartX + chartW) {
        ctx.strokeStyle = "#eee";
        ctx.beginPath();
        ctx.moveTo(x, axisY + axisH);
        ctx.lineTo(x, axisY + axisH + contentH);
        ctx.stroke();
        const d = new Date(tick);
        drawText(ctx, d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false }), x, axisY + 28, "bold 14px Consolas, monospace", "#333", "center");
        drawText(ctx, d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }), x, axisY + 46, "12px Segoe UI, sans-serif", "#888", "center");
      }
      tick += tickInterval;
    }
    const dayStart = new Date(globalMin);
    dayStart.setHours(0, 0, 0, 0);
    let dBand = dayStart.getTime();
    let bandIdx = 0;
    while (dBand < globalMax) {
      const dEnd = dBand + 864e5;
      const x1 = Math.max(chartX, chartX + (dBand - globalMin) / span * chartW);
      const x2 = Math.min(chartX + chartW, chartX + (dEnd - globalMin) / span * chartW);
      if (x2 > x1 && bandIdx % 2 === 1) {
        ctx.fillStyle = "rgba(0,0,0,0.02)";
        ctx.fillRect(x1, axisY + axisH, x2 - x1, contentH);
      }
      dBand = dEnd;
      bandIdx++;
    }
    const nowTs = Date.now();
    if (nowTs >= globalMin && nowTs <= globalMax) {
      const nx = chartX + (nowTs - globalMin) / span * chartW;
      ctx.strokeStyle = "#c62828";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(nx, axisY + axisH);
      ctx.lineTo(nx, axisY + axisH + contentH);
      ctx.stroke();
      ctx.setLineDash([]);
      drawText(ctx, "NOW", nx, axisY + axisH - 4, "bold 12px Segoe UI, sans-serif", "#c62828", "center");
    }
    const barsY = axisY + axisH + 20;
    sortedCats.forEach((cat, i) => {
      const ry = barsY + i * (rowH + rowGap);
      const cs = getCategoryExportStats(cat);
      const catBounds = getCategoryTimeBounds(cat);
      const theme = CAT_STATUS_LIGHT[cs.status] || CAT_STATUS_LIGHT.notstarted;
      const barTheme = GANTT_BAR[cs.status] || GANTT_BAR.notstarted;
      drawRoundRect(ctx, 12, ry, labelW - 20, rowH, 8, theme.bg, theme.border);
      drawDot(ctx, 28, ry + 24, 5, theme.dot);
      const nameStr = cat.length > 26 ? cat.substring(0, 24) + "..." : cat;
      drawText(ctx, nameStr, 42, ry + 28, "bold 16px Segoe UI, sans-serif", theme.text, "left");
      drawText(ctx, `${cs.done}/${cs.tasks.length} (${cs.catPct}%)`, 42, ry + 50, "14px Consolas, monospace", "#888", "left");
      const mbX = 200, mbW = 110, mbH = 6, mbY2 = ry + 44;
      drawRoundRect(ctx, mbX, mbY2, mbW, mbH, 3, "#e0e0e0");
      if (cs.catPct > 0) drawRoundRect(ctx, mbX, mbY2, Math.max(6, mbW * cs.catPct / 100), mbH, 3, theme.dot);
      if (cs.inProg > 0) {
        drawText(ctx, `${cs.inProg} active`, labelW - 30, ry + 50, "bold 12px Segoe UI, sans-serif", "#e65100", "right");
      }
      if (catBounds) {
        const bx1 = chartX + (catBounds.catMin - globalMin) / span * chartW;
        const bx2 = chartX + (catBounds.catMax - globalMin) / span * chartW;
        const bw = Math.max(8, bx2 - bx1);
        const barY = ry + 10;
        const barH = rowH - 20;
        drawRoundRect(ctx, bx1, barY, bw, barH, 8, barTheme.fill, barTheme.border);
        if (cs.catPct > 0) {
          const fillW = Math.max(8, bw * cs.catPct / 100);
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(bx1, barY, bw, barH, 8);
          ctx.clip();
          const grad = ctx.createLinearGradient(bx1, 0, bx1 + fillW, 0);
          grad.addColorStop(0, barTheme.gradFrom);
          grad.addColorStop(1, barTheme.gradTo);
          ctx.fillStyle = grad;
          ctx.fillRect(bx1, barY, fillW, barH);
          ctx.restore();
        }
        const textX = bx1 + Math.max(8, bw * cs.catPct / 100) / 2;
        if (cs.catPct > 0 && Math.max(8, bw * cs.catPct / 100) > 50) {
          drawText(ctx, cs.catPct + "%", textX, barY + barH / 2 + 6, "bold 16px Segoe UI, sans-serif", "#ffffff", "center");
        } else if (bw > 50) {
          drawText(ctx, cs.catPct + "%", bx1 + bw / 2, barY + barH / 2 + 6, "bold 16px Segoe UI, sans-serif", theme.text, "center");
        }
        const startLabel = new Date(catBounds.catMin).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });
        const endLabel = new Date(catBounds.catMax).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });
        drawText(ctx, startLabel, bx1, barY + barH + 14, "11px Consolas, monospace", "#aaa", "left");
        drawText(ctx, endLabel, bx1 + bw, barY + barH + 14, "11px Consolas, monospace", "#aaa", "right");
        const estEndMs = Math.max(
          ...[...cs.tasks.map((t) => t.estimatedEnd ? new Date(t.estimatedEnd).getTime() : 0).filter((v) => v > 0)]
