function exportGantt() {
    showToast("Generating Gantt chart...");

    const categories = Object.keys(state.runbookData).filter(k => !k.startsWith("_"));
    const sortedCats = sortCategories(categories);

    // Compute time bounds from all tasks
    let globalMin = Infinity, globalMax = -Infinity;
    sortedCats.forEach(cat => {
        state.runbookData[cat].forEach(t => {
            if (t.startTime) { const d = new Date(t.startTime).getTime(); if (!isNaN(d) && d < globalMin) globalMin = d; }
            if (t.endTime) { const d = new Date(t.endTime).getTime(); if (!isNaN(d) && d > globalMax) globalMax = d; }
        });
    });
    if (!isFinite(globalMin) || !isFinite(globalMax)) {
        showToast("No time data available for Gantt chart");
        return;
    }
    // Pad by 1 hour each side
    globalMin -= 3600000;
    globalMax += 3600000;
    const span = globalMax - globalMin;

    // Layout constants
    const W = 1920, labelW = 340, rightPad = 60, chartX = labelW, chartW = W - labelW - rightPad;
    const topH = 140; // header area
    const axisH = 60; // time axis
    const rowH = 72, rowGap = 6;
    const contentH = sortedCats.length * (rowH + rowGap) + 40;
    const legendH = 60;
    const H = topH + axisH + contentH + legendH + 40;

    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");

    // Background
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);

    // EXTRACT: drawText / drawRoundRect → dashboard/export/canvas.js (duplicate 3 of 3)
    const drawText = (text, x, y, font, color, align) => {
        ctx.fillStyle = color || "#1a1a2e";
        ctx.font = font || "20px Segoe UI, sans-serif";
        ctx.textAlign = align || "left";
        ctx.fillText(text, x, y);
    };
    const drawRoundRect = (x, y, w, h, r, fill, stroke) => {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
    };

    // ── TOP BAR ──
    ctx.fillStyle = state.projectConfig.accentColor;
    ctx.fillRect(0, 0, W, 70);
    if (state.clientLogoImg) {
        const lS = 46;
        ctx.save(); ctx.beginPath(); ctx.roundRect(16, 12, lS, lS, 7); ctx.clip();
        ctx.drawImage(state.clientLogoImg, 16, 12, lS, lS); ctx.restore();
    }
    drawText(state.projectConfig.projectName.toUpperCase() + " — GANTT CHART", W / 2, 44, "bold 28px Segoe UI, sans-serif", "#ffffff", "center");

    // Subtitle
    const now = new Date();
    const ts = now.toLocaleString("en-GB", { weekday:"short", day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit", hour12:false }) + " UK";
    ctx.fillStyle = "#f4f5f7";
    ctx.fillRect(0, 70, W, 36);
    drawText([state.projectConfig.subtitle, state.projectConfig.changeRef, ts].filter(Boolean).join("  |  "), W / 2, 94, "18px Segoe UI, sans-serif", "#555555", "center");
    ctx.fillStyle = state.projectConfig.accentColor;
    ctx.fillRect(0, 106, W, 3);

    // ── Health badge ──
    const healthCol = { Green:"#2e7d32", Amber:"#e65100", Red:"#c62828" }; // EXTRACT: → dashboard/export/theme.js (duplicate 3 of 3)
    const healthLbl = { Green:"ON TRACK", Amber:"AT RISK", Red:"ROLLBACK" }; // EXTRACT: → HEALTH_META (duplicate 3 of 3)
    const healthBg2 = { Green:"#e8f5e9", Amber:"#fff3e0", Red:"#ffebee" };
    drawRoundRect(20, 114, 220, 30, 15, healthBg2[state.healthStatus], healthCol[state.healthStatus]);
    ctx.beginPath(); ctx.arc(38, 129, 6, 0, Math.PI * 2); ctx.fillStyle = healthCol[state.healthStatus]; ctx.fill();
    drawText("GO-LIVE: " + healthLbl[state.healthStatus], 130, 135, "bold 14px Segoe UI, sans-serif", healthCol[state.healthStatus], "center");

    // ── Overall stats badge ──
    const { total, done, inProg, notStarted, blocking } = getGlobalStats();
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    drawText(`${done}/${total} completed (${pct}%)  |  ${blocking} blocking`, W - rightPad, 135, "bold 14px Segoe UI, sans-serif", "#555", "right");

    // ── TIME AXIS ──
    const axisY = topH;
    ctx.fillStyle = "#f8f8f8";
    ctx.fillRect(chartX, axisY, chartW, axisH);
    ctx.strokeStyle = "#e0e0e0";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(chartX, axisY + axisH); ctx.lineTo(chartX + chartW, axisY + axisH); ctx.stroke();

    // Generate time tick marks
    const startDate = new Date(globalMin);
    startDate.setMinutes(0, 0, 0);
    const tickInterval = 3600000 * 3; // 3-hour ticks
    let tick = startDate.getTime();
    while (tick <= globalMax) {
        const x = chartX + ((tick - globalMin) / span) * chartW;
        if (x >= chartX && x <= chartX + chartW) {
            // Vertical gridline
            ctx.strokeStyle = "#eee";
            ctx.beginPath(); ctx.moveTo(x, axisY + axisH); ctx.lineTo(x, axisY + axisH + contentH); ctx.stroke();
            // Tick label
            const d = new Date(tick);
            const hr = d.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit", hour12:false });
            const day = d.toLocaleDateString("en-GB", { day:"2-digit", month:"short" });
            drawText(hr, x, axisY + 28, "bold 14px Consolas, monospace", "#333", "center");
            drawText(day, x, axisY + 46, "12px Segoe UI, sans-serif", "#888", "center");
        }
        tick += tickInterval;
    }

    // Date band highlighting (alternate day backgrounds)
    const dayStart = new Date(globalMin);
    dayStart.setHours(0, 0, 0, 0);
    let dBand = dayStart.getTime();
    let bandIdx = 0;
    while (dBand < globalMax) {
        const dEnd = dBand + 86400000;
        const x1 = Math.max(chartX, chartX + ((dBand - globalMin) / span) * chartW);
        const x2 = Math.min(chartX + chartW, chartX + ((dEnd - globalMin) / span) * chartW);
        if (x2 > x1 && bandIdx % 2 === 1) {
            ctx.fillStyle = "rgba(0,0,0,0.02)";
            ctx.fillRect(x1, axisY + axisH, x2 - x1, contentH);
        }
        dBand = dEnd;
        bandIdx++;
    }

    // ── NOW line ──
    const nowTs = Date.now();
    if (nowTs >= globalMin && nowTs <= globalMax) {
        const nx = chartX + ((nowTs - globalMin) / span) * chartW;
        ctx.strokeStyle = "#c62828";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.beginPath(); ctx.moveTo(nx, axisY + axisH); ctx.lineTo(nx, axisY + axisH + contentH); ctx.stroke();
        ctx.setLineDash([]);
        drawText("NOW", nx, axisY + axisH - 4, "bold 12px Segoe UI, sans-serif", "#c62828", "center");
    }

    // ── GANTT BARS ──
    const barsY = axisY + axisH + 20;

    sortedCats.forEach((cat, i) => {
        const tasks = state.runbookData[cat];
        const ry = barsY + i * (rowH + rowGap);

        // Category time bounds
        let catMin = Infinity, catMax = -Infinity;
        tasks.forEach(t => {
            if (t.startTime) { const d = new Date(t.startTime).getTime(); if (!isNaN(d) && d < catMin) catMin = d; }
            if (t.endTime) { const d = new Date(t.endTime).getTime(); if (!isNaN(d) && d > catMax) catMax = d; }
        });

        const d = tasks.filter(t => normalizeStatus(t.status) === "Completed").length;
        const ip = tasks.filter(t => normalizeStatus(t.status) === "In Progress").length;
        const catPct = Math.round((d / tasks.length) * 100);
        const s = computeCategoryStatus(tasks);

        // Label area (left)
        const labelBg = s === "done" ? "#e8f5e9" : s === "inprogress" ? "#fff8e1" : "#ffebee";
        const labelColor = s === "done" ? "#2e7d32" : s === "inprogress" ? "#e65100" : "#c62828";
        drawRoundRect(12, ry, labelW - 20, rowH, 8, labelBg, s === "done" ? "#a5d6a7" : s === "inprogress" ? "#ffe082" : "#ef9a9a");

        // Status dot
        ctx.beginPath();
        ctx.arc(28, ry + 24, 5, 0, Math.PI * 2);
        ctx.fillStyle = labelColor;
        ctx.fill();

        // Category name (truncate if needed)
        const nameStr = cat.length > 26 ? cat.substring(0, 24) + "..." : cat;
        drawText(nameStr, 42, ry + 28, "bold 16px Segoe UI, sans-serif", labelColor, "left");

        // Count + percentage
        drawText(`${d}/${tasks.length} (${catPct}%)`, 42, ry + 50, "14px Consolas, monospace", "#888", "left");

        // Mini completion bar in label
        const mbX = 200, mbW = 110, mbH = 6, mbY2 = ry + 44;
        drawRoundRect(mbX, mbY2, mbW, mbH, 3, "#e0e0e0");
        if (catPct > 0) drawRoundRect(mbX, mbY2, Math.max(6, mbW * catPct / 100), mbH, 3, labelColor);

        // In-progress badge
        if (ip > 0) {
            drawText(`${ip} active`, labelW - 30, ry + 50, "bold 12px Segoe UI, sans-serif", "#e65100", "right");
        }

        // Gantt bar (in chart area)
        if (isFinite(catMin) && isFinite(catMax)) {
            const bx1 = chartX + ((catMin - globalMin) / span) * chartW;
            const bx2 = chartX + ((catMax - globalMin) / span) * chartW;
            const bw = Math.max(8, bx2 - bx1);
            const barY = ry + 10;
            const barH = rowH - 20;

            // Full bar (background = remaining)
            const bgFill = s === "done" ? "#c8e6c9" : s === "inprogress" ? "#ffe0b2" : "#ffcdd2";
            drawRoundRect(bx1, barY, bw, barH, 8, bgFill, s === "done" ? "#a5d6a7" : s === "inprogress" ? "#ffcc80" : "#ef9a9a");

            // Completed fill
            if (catPct > 0) {
                const fillW = Math.max(8, bw * catPct / 100);
                // Clip to bar shape
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(bx1, barY, bw, barH, 8);
                ctx.clip();
                const grad = ctx.createLinearGradient(bx1, 0, bx1 + fillW, 0);
                grad.addColorStop(0, s === "done" ? "#43a047" : "#2e7d32");
                grad.addColorStop(1, s === "done" ? "#66bb6a" : "#43a047");
                ctx.fillStyle = grad;
                ctx.fillRect(bx1, barY, fillW, barH);
                ctx.restore();
            }

            // Percentage text on bar
            const textX = bx1 + Math.max(8, bw * catPct / 100) / 2;
            if (catPct > 0 && Math.max(8, bw * catPct / 100) > 50) {
                drawText(catPct + "%", textX, barY + barH / 2 + 6, "bold 16px Segoe UI, sans-serif", "#ffffff", "center");
            } else if (bw > 50) {
                drawText(catPct + "%", bx1 + bw / 2, barY + barH / 2 + 6, "bold 16px Segoe UI, sans-serif", labelColor, "center");
            }

            // Time labels below bar
            const startLabel = new Date(catMin).toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit", hour12:false });
            const endLabel = new Date(catMax).toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit", hour12:false });
            drawText(startLabel, bx1, barY + barH + 14, "11px Consolas, monospace", "#aaa", "left");
            drawText(endLabel, bx1 + bw, barY + barH + 14, "11px Consolas, monospace", "#aaa", "right");
        }
    });

    // ── LEGEND ──
    const legY = barsY + sortedCats.length * (rowH + rowGap) + 20;
    ctx.strokeStyle = "#e0e0e0";
    ctx.beginPath(); ctx.moveTo(60, legY); ctx.lineTo(W - 60, legY); ctx.stroke();
    const items = [
        { color: "#43a047", label: "Completed" },
        { color: "#ffe0b2", label: "In Progress", border: "#ffcc80" },
        { color: "#ffcdd2", label: "Not Started", border: "#ef9a9a" }
    ];
    let lx = W / 2 - 200;
    items.forEach(it => {
        drawRoundRect(lx, legY + 12, 20, 14, 4, it.color, it.border || it.color);
        drawText(it.label, lx + 28, legY + 24, "14px Segoe UI, sans-serif", "#555", "left");
        lx += 130;
    });
    // Now line legend
    ctx.strokeStyle = "#c62828";
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(lx, legY + 19); ctx.lineTo(lx + 20, legY + 19); ctx.stroke();
    ctx.setLineDash([]);
    drawText("Current Time", lx + 28, legY + 24, "14px Segoe UI, sans-serif", "#c62828", "left");

    // ── FOOTER ──
    ctx.fillStyle = state.projectConfig.accentColor;
    ctx.fillRect(0, H - 28, W, 28);
    drawText("Generated from Runbook Dashboard", W / 2, H - 10, "14px Segoe UI, sans-serif", "#ffffff", "center");

    // ── Export ──
    cv.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "runbook_gantt_" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-") + ".png";
        a.click();
        URL.revokeObjectURL(url);
        showToast("Gantt chart ready!");
    }, "image/png");
}

function exportJSON() {
    const exportData = Object.assign({}, state.runbookData, { _issues: state.issues, _health: state.healthStatus });
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "runbook_" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
    URL.revokeObjectURL(url);
    showToast("JSON exported (includes issues)");
}

function applyLoadedRunbook(fresh) {
    if (!fresh || typeof fresh !== "object" || Array.isArray(fresh)) {
        throw new Error("Invalid JSON structure");
    }
    state.runbookData = fresh;
    state.issues = state.runbookData._issues || [];
    state.healthStatus = state.runbookData._health || "Green";
    state.issueFormOpen = false;
    state.editingIssueId = null;
    render();
}

async function reloadRunbookJSON() {
    try {
        const res = await fetch("runbook.json?_ts=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);

        const fresh = await res.json();
        applyLoadedRunbook(fresh);
        showToast("Reloaded runbook.json");
    } catch (e) {
        showToast("Failed to reload runbook.json");
    }
}

function triggerFileRunbookLoad() {
    const input = document.getElementById("runbookFileInput");
    input.value = "";
    input.click();
}

function handleRunbookFileSelected(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
        try {
            const fresh = JSON.parse(reader.result);
            applyLoadedRunbook(fresh);
            showToast("Loaded runbook from local file");
        } catch (e) {
            showToast("Invalid JSON file");
        }
    };
    reader.onerror = () => showToast("Failed to read local file");
    reader.readAsText(file);
}

function expandAll() {
    Object.keys(state.runbookData).filter(k => !k.startsWith("_")).forEach(cat => state.openCategories.add(cat));
    render();
}

function collapseAll() {
    state.openCategories.clear();
    render();
}

// EVENT LISTENERS
document.querySelectorAll(".filterBtn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".filterBtn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.filterState = btn.dataset.filter;
        render();
    });
});

document.getElementById("searchBox").addEventListener("input", (e) => {
    state.searchQuery = e.target.value.trim();
    render();
});

document.getElementById("teamFilter").addEventListener("change", (e) => {
    state.teamFilter = e.target.value;
    render();
});

document.getElementById("sortSelect").addEventListener("change", (e) => {
    state.sortMode = e.target.value;
    render();
});

// Keyboard shortcut: Ctrl+S to save
document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") {
        e.preventDefault();
        saveToLocalStorage();
    }
});

// ── LOGO & BACKGROUND DETECTION ──

function setFavicon(src) {
    const link = document.getElementById('favicon');
    if (link) link.href = src;
}

function detectAssets() {
    const exts = ['png', 'jpg', 'jpeg', 'svg', 'webp'];

    function loadLogo(src) {
        const img = new Image();
        img.onload = () => {
            state.clientLogoImg = img;
            const el = document.getElementById('clientLogo');
            el.src = src;
            el.classList.remove('hidden');
            setFavicon(src);
        };
        img.src = src;
    }

    function loadBg(src) {
        const bgImg = new Image();
        bgImg.onload = () => {
            state.clientBgImg = bgImg;
            document.getElementById('bgOverlay').style.backgroundImage = 'url(' + src + ')';
        };
        bgImg.src = src;
    }

    // 1st priority: explicit paths from config.json (works without a server)
    if (state.projectConfig.logoFile) loadLogo('assets/' + state.projectConfig.logoFile);
    if (state.projectConfig.backgroundFile) loadBg('assets/' + state.projectConfig.backgroundFile);

    // 2nd priority: auto-detect via directory listing (requires Python server)
    if (!state.projectConfig.logoFile || !state.projectConfig.backgroundFile) {
        fetch('assets/')
            .then(r => r.ok ? r.text() : '')
            .then(html => {
                if (!html) return;
                if (!state.projectConfig.logoFile) {
                    const m = html.match(/href="([^"]*clientLogo[^"]*\.(png|jpg|jpeg|svg|webp))"/i);
                    if (m) loadLogo('assets/' + m[1].replace(/.*\//, ''));
                }
                if (!state.projectConfig.backgroundFile) {
                    const m = html.match(/href="([^"]*background[^"]*\.(png|jpg|jpeg|svg|webp))"/i);
                    if (m) loadBg('assets/' + m[1].replace(/.*\//, ''));
                }
            })
            .catch(() => {
                // 3rd priority: guess exact names
                if (!state.projectConfig.logoFile) {
                    exts.forEach(ext => loadLogo('assets/clientLogo.' + ext));
                }
                if (!state.projectConfig.backgroundFile) {
                    exts.forEach(ext => loadBg('assets/background.' + ext));
                }
            });
    }
}

function toggleIssuesPanel(el) {
    state.issuesPanelOpen = !state.issuesPanelOpen;
    document.getElementById('issuesList').style.display = state.issuesPanelOpen ? 'block' : 'none';
    el.querySelector('.iss-chevron').classList.toggle('open', state.issuesPanelOpen);
}

// INIT
updateClock();
setInterval(updateClock, 1000);
loadConfig().then(() => { detectAssets(); loadRunbook(); });

// Expose to global scope for HTML onclick attributes
// (Phase 9 will move these to addEventListener)
Object.assign(window, {
  toggleTheme, setHealth, showPhoneExportOptions, showEmailExportOptions,
  exportGantt, generateSummary, copySummaryToClipboard,
  saveToLocalStorage, exportJSON, resetRunbook,
  reloadRunbookJSON, triggerFileRunbookLoad, handleRunbookFileSelected,
  expandAll, collapseAll,
  toggleIssueForm, saveIssue, closeIssue, reopenIssue, editIssue, deleteIssue,
  toggleIssuesPanel,
});
</script>
