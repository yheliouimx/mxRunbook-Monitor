<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go-Live Runbook Dashboard</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   DESIGN TOKENS — mirrors runbookDashboard.html dark corporate
   ══════════════════════════════════════════════════════════════ */
:root {
    --color-surface:          #0a0a0f;
    --color-surface-elevated: #111118;
    --color-surface-hover:    #151520;
    --color-text-primary:     #e0e0e0;
    --color-text-secondary:   #888;
    --color-text-dim:         #555;
    --color-text-emphasis:    #ffffff;
    --color-border:           #222;
    --color-border-strong:    #333;
    --color-success:          #10b981;
    --color-primary:          #10b981;

    --glass-bg:               rgba(17, 17, 24, 0.55);
    --glass-bg-elevated:      rgba(22, 22, 32, 0.65);
    --glass-bg-card:          rgba(14, 14, 20, 0.70);
    --glass-blur:             20px;
    --glass-border:           rgba(255, 255, 255, 0.07);
    --glass-shadow:           0 4px 32px rgba(0, 0, 0, 0.45);
    --glass-shadow-hover:     0 8px 48px rgba(0, 0, 0, 0.6);

    --font-sans: 'Outfit', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Consolas', monospace;

    --text-xs:   0.68rem;
    --text-sm:   0.78rem;
    --text-base: 0.88rem;
    --text-md:   0.95rem;
    --text-lg:   1.1rem;
    --text-xl:   1.35rem;
    --text-2xl:  1.65rem;
    --text-3xl:  2rem;

    --radius-sm:  8px;
    --radius-md:  12px;
    --radius-lg:  16px;
    --radius-xl:  20px;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--color-surface);
    color: var(--color-text-primary);
    font-family: var(--font-sans);
    overflow-x: hidden;
}

/* ══ BACKGROUND LAYER ══════════════════════════════════════════ */
#bgOverlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('assets/Murex_background6.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    opacity: 0.80;
    pointer-events: none;
}

/* Dark vignette on top of background to push focus to center */
#bgOverlay::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse 70% 60% at 50% 50%, transparent 30%, rgba(5,5,10,0.55) 100%),
        linear-gradient(to bottom, rgba(5,5,10,0.25) 0%, transparent 30%, transparent 70%, rgba(5,5,10,0.35) 100%);
}

/* Ambient depth gradient — gives glass something to blur over */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 1;
    background:
        radial-gradient(ellipse 80% 50% at 20% 20%, rgba(56,30,114,0.25) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 70%, rgba(20,60,100,0.22) 0%, transparent 55%),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(10,80,60,0.10) 0%, transparent 50%);
    pointer-events: none;
}

/* ══ PAGE LAYOUT ════════════════════════════════════════════════ */
.welcome-root {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 64px;
    gap: 0;
}

/* ══ HERO PANEL ═════════════════════════════════════════════════ */
.hero-panel {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    margin-bottom: 56px;
    animation: fadeInUp 0.6s ease both;
}

/* Brand strip inside hero */
.brand-strip {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 32px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-xl);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    box-shadow: var(--glass-shadow);
    width: 100%;
}
.murex-logo {
    height: 38px;
    width: auto;
    flex-shrink: 0;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
}
.murex-logo.hidden { display: none; }
.murex-logo-fallback {
    font-size: var(--text-xl);
    font-weight: 800;
    color: var(--color-success);
    letter-spacing: -0.02em;
    flex-shrink: 0;
}
.brand-text { flex: 1; min-width: 0; }
.brand-title {
    font-size: var(--text-lg);
    font-weight: 700;
    color: var(--color-text-emphasis);
    letter-spacing: -0.01em;
    margin: 0 0 2px;
    line-height: 1.2;
}
.brand-subtitle {
    font-size: var(--text-xs);
    color: var(--color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 1.2px;
}
.version-badge {
    font-size: var(--text-xs);
    font-family: var(--font-mono);
    color: var(--color-text-dim);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--color-border);
    border-radius: 6px;
    padding: 3px 8px;
    flex-shrink: 0;
}

/* ══ OPEN CARD (primary CTA) ════════════════════════════════════ */
.open-card {
    display: flex;
    align-items: center;
    gap: 20px;
    width: 100%;
    padding: 24px 28px;
    background: var(--glass-bg-elevated);
    border: 1px solid var(--glass-border);
    border-left: 4px solid var(--color-primary);
    border-radius: var(--radius-lg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    box-shadow: var(--glass-shadow);
    cursor: pointer;
    text-align: left;
    color: inherit;
    font-family: inherit;
    transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease;
    animation: fadeInUp 0.6s 0.1s ease both;
}
.open-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--glass-shadow-hover);
    border-left-color: #1de9a0;
    background: rgba(22,22,36,0.80);
}
.open-card:active { transform: translateY(-1px); }

.open-card-icon {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    background: rgba(16,185,129,0.12);
    border: 1px solid rgba(16,185,129,0.25);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.18s, border-color 0.18s;
}
.open-card:hover .open-card-icon {
    background: rgba(16,185,129,0.20);
    border-color: rgba(16,185,129,0.45);
}
.open-card-icon svg {
    width: 26px;
    height: 26px;
    color: var(--color-success);
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.open-card-body { flex: 1; min-width: 0; }
.open-card-value {
    font-size: var(--text-xl);
    font-weight: 700;
    color: var(--color-text-emphasis);
    margin-bottom: 4px;
    letter-spacing: -0.01em;
}
.open-card-label {
    font-size: var(--text-sm);
    color: var(--color-text-secondary);
}

.open-card-arrow {
    font-size: 1.4rem;
    color: var(--color-success);
    opacity: 0.7;
    transition: transform 0.18s ease, opacity 0.18s;
    flex-shrink: 0;
}
.open-card:hover .open-card-arrow {
    transform: translateX(4px);
    opacity: 1;
}

/* ══ RECENT SECTION ═════════════════════════════════════════════ */
.recent-section {
    width: 100%;
    max-width: 1160px;
    animation: fadeInUp 0.65s 0.2s ease both;
}

.recent-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 16px;
    padding: 0 2px;
}
.recent-label {
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--color-text-secondary);
    font-weight: 600;
}
.recent-count {
    font-size: var(--text-xs);
    font-family: var(--font-mono);
    color: var(--color-text-dim);
}

/* Grid: responsive, min 240px per card */
.recent-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
}

/* ══ RECENT CLIENT CARD ═════════════════════════════════════════ */
.recent-card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px 18px 16px 22px;
    background: var(--glass-bg-card);
    border: 1px solid var(--glass-border);
    border-left: 4px solid var(--card-accent, var(--color-primary));
    border-radius: var(--radius-md);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    box-shadow: var(--glass-shadow);
    cursor: pointer;
    transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease;
    overflow: hidden;
    animation: fadeInUp 0.45s ease both;
}
.recent-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--glass-shadow-hover);
    background: rgba(18,18,28,0.85);
}
.recent-card:active { transform: translateY(-1px); }

/* Logo row */
.recent-card-top {
    display: flex;
    align-items: center;
    gap: 10px;
}
.recent-card-logo-wrap {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
}
.recent-card-logo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 4px;
}
.recent-card-logo-fallback {
    font-size: var(--text-xl);
    font-weight: 800;
    line-height: 1;
    color: var(--card-accent, var(--color-primary));
    text-transform: uppercase;
}

/* Text body */
.recent-card-body { flex: 1; min-width: 0; }
.recent-card-client {
    font-size: var(--text-md);
    font-weight: 700;
    color: var(--color-text-emphasis);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
    margin-bottom: 2px;
}
.recent-card-project {
    font-size: var(--text-sm);
    color: var(--color-text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Meta row */
.recent-card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}
.recent-card-date {
    font-size: var(--text-xs);
    font-family: var(--font-mono);
    color: var(--color-text-dim);
}
.recent-card-subtitle {
    font-size: var(--text-xs);
    color: var(--color-text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 50%;
    text-align: right;
}

/* Remove button — top-right, appears on hover */
.recent-card-remove {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 22px;
    height: 22px;
    background: rgba(239,68,68,0.15);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 50%;
    color: #ef4444;
    font-size: 0.65rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s ease, background 0.15s ease;
    font-family: inherit;
    padding: 0;
}
.recent-card:hover .recent-card-remove { opacity: 1; }
.recent-card-remove:hover {
    background: rgba(239,68,68,0.35);
    border-color: #ef4444;
}

/* ══ EMPTY STATE ════════════════════════════════════════════════ */
.empty-state {
    grid-column: 1 / -1;
    padding: 40px 20px;
    text-align: center;
    color: var(--color-text-dim);
    font-size: var(--text-sm);
    border: 1px dashed var(--color-border);
    border-radius: var(--radius-md);
    background: rgba(255,255,255,0.01);
}

/* ══ TOAST ══════════════════════════════════════════════════════ */
.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: #1c1c28;
    border: 1px solid #ef444466;
    border-radius: 10px;
    color: #fca5a5;
    padding: 10px 22px;
    font-size: var(--text-sm);
    font-weight: 500;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    max-width: 480px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* ══ LOADING OVERLAY ════════════════════════════════════════════ */
.loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 8000;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
}
.loading-spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top-color: var(--color-success);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

/* ══ NON-ELECTRON FALLBACK ══════════════════════════════════════ */
.no-electron-msg {
    position: fixed;
    inset: 0;
    z-index: 9000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5,5,10,0.88);
    backdrop-filter: blur(8px);
}
.no-electron-inner {
    text-align: center;
    padding: 40px 48px;
    background: var(--glass-bg-elevated);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-xl);
    box-shadow: var(--glass-shadow);
    max-width: 440px;
}
.no-electron-inner h2 {
    font-size: var(--text-xl);
    font-weight: 700;
    color: var(--color-text-emphasis);
    margin: 0 0 12px;
}
.no-electron-inner p {
    font-size: var(--text-sm);
    color: var(--color-text-secondary);
    margin: 0 0 20px;
    line-height: 1.6;
}
.no-electron-inner a {
    color: var(--color-success);
    text-decoration: none;
    font-weight: 600;
}
.no-electron-inner a:hover { text-decoration: underline; }

/* ══ ANIMATIONS ═════════════════════════════════════════════════ */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<!-- ── Background ──────────────────────────────────────────────── -->
<div id="bgOverlay"></div>

<!-- ── Main layout ─────────────────────────────────────────────── -->
<div class="welcome-root">

    <!-- Hero panel -->
    <div class="hero-panel">

        <!-- Brand strip: Murex logo + title -->
        <div class="brand-strip">
            <img
                id="murexLogo"
                src="assets/murex-logo-white.png"
                class="murex-logo"
                alt="Murex"
                onerror="this.classList.add('hidden'); document.getElementById('murexLogoFallback').style.display='block'"
            >
            <span id="murexLogoFallback" class="murex-logo-fallback" style="display:none">Murex</span>
            <div class="brand-text">
                <div class="brand-title">Go-Live Runbook Dashboard</div>
                <div class="brand-subtitle">Client Runbook Monitor</div>
            </div>
            <span class="version-badge" id="versionBadge">v2</span>
        </div>

        <!-- Primary CTA: open a new client folder -->
        <button class="open-card" id="openFolderBtn" aria-label="Open client runbook folder">
            <div class="open-card-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <!-- folder-open icon -->
                    <path d="M3 7C3 5.9 3.9 5 5 5h4l2 2h8c1.1 0 2 .9 2 2v1H3V7z"/>
                    <path d="M3 10h18l-1.5 8H4.5L3 10z"/>
                </svg>
            </div>
            <div class="open-card-body">
                <div class="open-card-value">Open Client Runbook</div>
                <div class="open-card-label">Select a folder containing config.json and runbook files</div>
            </div>
            <div class="open-card-arrow">→</div>
        </button>

    </div><!-- /hero-panel -->

    <!-- Recent runbooks -->
    <section class="recent-section" id="recentSection">
        <div class="recent-header">
            <span class="recent-label">Recent Runbooks</span>
            <span class="recent-count" id="recentCount"></span>
        </div>
        <div class="recent-grid" id="recentGrid">
            <!-- rendered by JS -->
        </div>
    </section>

</div><!-- /welcome-root -->

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay" style="display:none">
    <div class="loading-spinner"></div>
</div>

<script>
(function () {
'use strict';

// ── Toast helper ────────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ── Loading overlay ─────────────────────────────────────────────
function setLoading(on) {
    document.getElementById('loadingOverlay').style.display = on ? 'flex' : 'none';
}

// ── Date formatter ──────────────────────────────────────────────
function fmtDate(iso) {
    if (!iso) return '';
    try {
        const d = new Date(iso);
        return d.toLocaleDateString('en-GB', {
            day: '2-digit', month: 'short', year: 'numeric'
        });
    } catch (_) { return ''; }
}

// ── Escape HTML ─────────────────────────────────────────────────
function esc(s) {
    if (!s) return '';
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// ── Render recent cards ─────────────────────────────────────────
function renderRecentCards(recents) {
    const grid  = document.getElementById('recentGrid');
    const count = document.getElementById('recentCount');

    if (!recents || recents.length === 0) {
        count.textContent = '';
        grid.innerHTML = `<div class="empty-state">No recent runbooks yet — open a client folder to get started.</div>`;
        return;
    }

    count.textContent = `(${recents.length})`;
    grid.innerHTML = '';

    recents.forEach((r, i) => {
        const card = document.createElement('div');
        card.className = 'recent-card';
        card.style.cssText = `--card-accent:${esc(r.accentColor || '#10b981')};animation-delay:${i * 0.05}s`;
        card.dataset.path = r.path;

        const logoHtml = r.logoDataUrl
            ? `<img class="recent-card-logo" src="${esc(r.logoDataUrl)}" alt="${esc(r.clientName)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`
            : '';
        const fallbackInitial = (r.clientName || '?').charAt(0).toUpperCase();

        card.innerHTML = `
            <div class="recent-card-top">
                <div class="recent-card-logo-wrap">
                    ${logoHtml}
                    <span class="recent-card-logo-fallback" style="${r.logoDataUrl ? 'display:none' : ''}">${esc(fallbackInitial)}</span>
                </div>
                <div class="recent-card-body">
                    <div class="recent-card-client">${esc(r.clientName || r.projectName || 'Unknown Client')}</div>
                    <div class="recent-card-project">${esc(r.projectName || '')}</div>
                </div>
            </div>
            <div class="recent-card-meta">
                <span class="recent-card-date">${esc(fmtDate(r.lastOpened))}</span>
                <span class="recent-card-subtitle">${esc(r.subtitle || '')}</span>
            </div>
            <button class="recent-card-remove" title="Remove from recents" aria-label="Remove ${esc(r.clientName)} from recents">✕</button>
        `;

        // Click to open
        card.addEventListener('click', (e) => {
            if (e.target.closest('.recent-card-remove')) return;
            openRecentFolder(r);
        });

        // Remove button
        card.querySelector('.recent-card-remove').addEventListener('click', async (e) => {
            e.stopPropagation();
            await window.electronAPI.removeRecentClient(r.path);
            card.style.transition = 'opacity 0.25s, transform 0.25s';
            card.style.opacity = '0';
            card.style.transform = 'scale(0.94)';
            setTimeout(async () => {
                const updated = await window.electronAPI.getRecentClients();
                renderRecentCards(updated);
            }, 270);
        });

        grid.appendChild(card);
    });
}

// ── Open a client folder (new) ───────────────────────────────────
async function openNewFolder() {
    const folderPath = await window.electronAPI.openFolder();
    if (!folderPath) return; // user cancelled

    setLoading(true);
    try {
        const cfg = await window.electronAPI.readConfig(folderPath);
        if (!cfg) {
            showToast('No config.json found in that folder. Please select a valid client runbook folder.');
            return;
        }

        // Read logo as data URL for storage (so the recent card shows it without folder access)
        let logoDataUrl = '';
        if (cfg.logoFile) {
            logoDataUrl = await window.electronAPI.readFileAsDataUrl(folderPath, cfg.logoFile) || '';
        }

        await window.electronAPI.addRecentClient({
            path:            folderPath,
            clientName:      cfg.client     || cfg.projectName || '',
            projectName:     cfg.projectName || '',
            subtitle:        cfg.subtitle   || '',
            accentColor:     cfg.accentColor || '#10b981',
            logoFile:        cfg.logoFile   || '',
            backgroundFile:  cfg.backgroundFile || '',
            logoDataUrl,
            lastOpened:      new Date().toISOString(),
        });

        await window.electronAPI.openDashboard(folderPath);
    } catch (err) {
        showToast('Failed to open folder: ' + (err && err.message ? err.message : 'Unknown error'));
    } finally {
        setLoading(false);
    }
}

// ── Open a recent client ─────────────────────────────────────────
async function openRecentFolder(entry) {
    setLoading(true);
    try {
        // Verify folder is still accessible
        const cfg = await window.electronAPI.readConfig(entry.path);
        if (!cfg) {
            showToast(`Cannot access "${entry.clientName}" — folder may have moved or been deleted.`);
            return;
        }

        // Update lastOpened timestamp
        await window.electronAPI.addRecentClient({
            ...entry,
            lastOpened: new Date().toISOString(),
        });

        await window.electronAPI.openDashboard(entry.path);
    } catch (err) {
        showToast('Failed to open runbook: ' + (err && err.message ? err.message : 'Unknown error'));
    } finally {
        setLoading(false);
    }
}

// ── Boot ─────────────────────────────────────────────────────────
async function init() {
    // Guard: this page requires Electron
    if (!window.electronAPI || !window.electronAPI.isElectron) {
        const msg = document.createElement('div');
        msg.className = 'no-electron-msg';
        msg.innerHTML = `
            <div class="no-electron-inner">
                <h2>Electron required</h2>
                <p>This welcome page is designed to run inside the Electron app.<br>
                   Start the app with <code style="font-family:var(--font-mono);font-size:0.85em">npm run electron</code>.</p>
                <a href="runbookDashboard.html">→ Open dashboard directly (dev mode)</a>
            </div>`;
        document.body.appendChild(msg);
        return;
    }

    // Wire open button
    document.getElementById('openFolderBtn').addEventListener('click', openNewFolder);

    // Load recent clients
    try {
        const recents = await window.electronAPI.getRecentClients();
        renderRecentCards(recents);
    } catch (_) {
        renderRecentCards([]);
    }
}

// Keyboard shortcut: Cmd/Ctrl+O opens folder
document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'o') {
        e.preventDefault();
        if (window.electronAPI && window.electronAPI.isElectron) openNewFolder();
    }
});

document.addEventListener('DOMContentLoaded', init);

})();
</script>
</body>
</html>
